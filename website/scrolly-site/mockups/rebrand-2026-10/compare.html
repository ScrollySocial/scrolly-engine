<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tone compare</title>
<meta name="robots" content="noindex">
<style>
/* Side-by-side: current rebrand vs the "less girly" tone (2026-10-20). Each frame scrolls on its own. */
*{box-sizing:border-box}
body{margin:0;background:#e9e5dd;font:600 15px/1.3 Arial,sans-serif;color:#111}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 16px;background:#111;color:#fff}
.bar button{min-height:36px;padding:6px 14px;border:1px solid #666;border-radius:999px;background:#222;color:#fff;font:600 15px/1 Arial,sans-serif;cursor:pointer}
.bar button[aria-pressed=true]{background:#fff;color:#111}
.wrap{display:flex;gap:16px;justify-content:center;padding:16px;overflow-x:auto}
figure{margin:0;flex:none}
figcaption{margin:0 0 8px;font-size:16px}
iframe{display:block;border:0;border-radius:12px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div class="bar"><span>Same page, two tones.</span>
  <span>Size:</span><button type="button" data-w="390" aria-pressed="true">Phone</button><button type="button" data-w="1280">Desktop</button>
</div>
<div class="wrap">
  <figure><figcaption>Current</figcaption><iframe title="Current tone" src="index.html?bar=0&t=current"></iframe></figure>
  <figure><figcaption>Less girly</figcaption><iframe title="Less girly tone" src="index.html?bar=0&t=neutral"></iframe></figure>
</div>
<script>
(function(){
  var frames=document.querySelectorAll('iframe'), btns=document.querySelectorAll('.bar button');
  function size(w){var avail=(innerWidth-48)/2, scale=Math.min(1,avail/w);
    frames.forEach(function(f){f.style.width=w+'px';f.style.height=Math.round((innerHeight-110)/scale)+'px';f.style.transform='scale('+scale+')';f.style.transformOrigin='0 0';
      f.parentNode.style.width=Math.round(w*scale)+'px';f.parentNode.style.height=Math.round((innerHeight-110)+30)+'px'});
    btns.forEach(function(b){b.setAttribute('aria-pressed',String(+b.dataset.w===w))});}
  btns.forEach(function(b){b.onclick=function(){size(+b.dataset.w)}});
  addEventListener('resize',function(){size(+document.querySelector('.bar button[aria-pressed=true]').dataset.w)});
  size(390);
})();
</script>
</body>
</html>
