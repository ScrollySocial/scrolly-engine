# Scrolly comments: n8n + Caddy (automatic HTTPS) on one small server.
# Separate from the old laptop n8n (automation/n8n/, pinned 1.70.0): this one is
# public, so it runs a current, patched n8n and is pinned to an exact version.
# Upgrade by changing the tag on purpose, never :latest (see README.md).
services:
  n8n:
    image: n8nio/n8n:2.44.6
    container_name: n8n-comments
    restart: unless-stopped
    env_file: .env
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_PROXY_HOPS=1
      - NODE_ENV=production
      # The Code nodes read settings from $env, check Meta's signature (crypto)
      # and read the keyword list (fs).
      # One run at a time: the "already seen" and "DM sent" lists live in one
      # state file (see workflow/src/_lib.js), which must never have two writers.
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=1
      # The TikTok job waits up to 5 minutes for Apify inside a Code node.
      - N8N_RUNNERS_TASK_TIMEOUT=600
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto,fs
      - KEYWORDS_FILE=/data/config/keywords.json
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config:/data/config:ro
      - ./workflow:/data/workflow:ro
    # Only Caddy talks to n8n; nothing is published on the server's own ports.
    expose:
      - "5678"
    mem_limit: 700m

  # Mercedes's comment dashboard and the inbox n8n writes to (inbox/server.mjs, no npm
  # packages). It gets only the settings it needs, not the platform tokens.
  inbox:
    image: node:22.11.0-alpine
    container_name: inbox-comments
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    environment:
      - INBOX_API_SECRET=${INBOX_API_SECRET}
      - INBOX_SETUP_CODE=${INBOX_SETUP_CODE}
      - RUN_SECRET=${RUN_SECRET}
      - YOUTUBE_KEEP_DAYS=${YOUTUBE_KEEP_DAYS:-21}
      - TZ=${TZ:-America/Chicago}
    volumes:
      - ./inbox:/app:ro
      - inbox_data:/data
      # keywords-all.json (edited in the dashboard) and keywords.json (read by n8n)
      - ./config:/config
    expose:
      - "3000"
    mem_limit: 128m

  caddy:
    image: caddy:2.11.7
    container_name: caddy-comments
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - N8N_HOST=${N8N_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
      - inbox

volumes:
  n8n_data:
  inbox_data:
  caddy_data:
  caddy_config:
