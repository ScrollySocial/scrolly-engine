<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Scrolly Order Monitoring</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --text-dim: #9aa1ae;
    --text-dimmer: #6b7280;
    --accent: #5b8cff;
    --red: #ef4444;
    --red-bg: #3a1414;
    --amber: #f59e0b;
    --amber-bg: #3a2c0e;
    --purple: #a78bfa;
    --purple-bg: #2a1f3d;
    --blue: #3b82f6;
    --blue-bg: #10203f;
    --gray: #9aa1ae;
    --gray-bg: #23262e;
    --green: #22c55e;
    --green-bg: #0f2a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  header {
    padding: 20px 28px 8px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 2px; font-size: 20px; font-weight: 600; }
  header .sub { color: var(--text-dim); font-size: 13px; }
  main { padding: 20px 28px 60px; max-width: 1600px; margin: 0 auto; }

  .cards { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .card .n { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .card .l { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  .card.needs-attention .n { color: var(--red); }
  .card.awaiting-approval .n { color: var(--amber); }
  .card.running .n { color: var(--blue); }

  .table-scroll { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); }
  thead th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--text-dimmer); padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--panel-2);
    white-space: nowrap;
  }
  tbody td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: top; white-space: nowrap; }
  tbody td.wrap { white-space: normal; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody tr.row-click { cursor: pointer; }
  tbody tr.tier-0 { background: rgba(239,68,68,0.08); }
  tbody tr.tier-0:hover { background: rgba(239,68,68,0.13); }
  tbody tr.tier-1 { background: rgba(245,158,11,0.06); }
  tbody tr.tier-1:hover { background: rgba(245,158,11,0.1); }
  tbody tr.tier-2 { background: rgba(167,139,250,0.06); }
  tbody tr.tier-2:hover { background: rgba(167,139,250,0.1); }
  tbody tr.tier-3 { background: rgba(59,130,246,0.06); }

  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; white-space: nowrap;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .badge-needs_attention { background: var(--red-bg); color: #ff8080; }
  .badge-needs_attention .dot { background: var(--red); box-shadow: 0 0 6px var(--red); }
  /* Review-required is a needs_attention order with a usable report already
     sitting there for a human to judge — warm/amber, not the severe red
     used for a genuinely broken run. See order-aggregator.mjs's
     isReviewRequired() for the exact derivation. */
  .badge-review_required { background: var(--amber-bg); color: #ffcb7a; }
  .badge-review_required .dot { background: var(--amber); }
  .badge-awaiting_final_review { background: var(--amber-bg); color: #ffcb7a; }
  .badge-awaiting_final_review .dot { background: var(--amber); }
  .badge-running { background: var(--blue-bg); color: #9cc0ff; }
  .badge-running .dot { background: var(--blue); }
  .badge-awaiting_intake, .badge-paid { background: var(--gray-bg); color: var(--gray); }
  .badge-awaiting_intake .dot, .badge-paid .dot { background: var(--gray); }
  .badge-delivered { background: var(--green-bg); color: #7fe3a4; }
  .badge-delivered .dot { background: var(--green); }
  .badge-ready_to_run, .badge-approved, .badge-delivering { background: var(--gray-bg); color: var(--gray); }
  .badge-ready_to_run .dot, .badge-approved .dot, .badge-delivering .dot { background: var(--gray); }

  .pill { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; }
  .pill-ok { background: var(--green-bg); color: #7fe3a4; }
  .pill-fail { background: var(--red-bg); color: #ff8080; }
  .pill-pending { background: var(--gray-bg); color: var(--gray); }
  .pill-warn { background: var(--amber-bg); color: #ffcb7a; }

  .muted { color: var(--text-dimmer); }
  .mono { font-variant-numeric: tabular-nums; }
  .problem { color: #ff8080; font-size: 12.5px; max-width: 260px; white-space: normal; }
  .approx { color: var(--text-dimmer); font-style: italic; }
  .attention-flag { color: var(--red); font-weight: 700; }
  a.link, button.link {
    color: var(--accent); text-decoration: none; font-size: 13px; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit;
  }
  a.link:hover, button.link:hover { text-decoration: underline; }

  .back { display: inline-block; margin-bottom: 16px; }

  .detail-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 20px; }
  .panel h2 { margin: 0 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); }
  .panel.fail { border-color: rgba(239,68,68,0.4); background: var(--red-bg); }
  .panel.fail h2 { color: #ff8080; }
  .panel.review { border-color: rgba(245,158,11,0.4); background: var(--amber-bg); }
  .panel.review h2 { color: #ffcb7a; }
  .review-summary { margin: 0 0 14px; font-size: 13.5px; }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 7px 16px; margin: 0; }
  dl.kv dt { color: var(--text-dim); font-size: 12.5px; }
  dl.kv dd { margin: 0; font-size: 13.5px; }

  .state-row { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 4px; }
  .state-item .l { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  .state-item .v { font-size: 15px; font-weight: 600; margin-top: 2px; }

  .cap-list { list-style: none; margin: 0; padding: 0; }
  .cap-list li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 12.5px; border-bottom: 1px dashed var(--border); }
  .cap-list li:last-child { border-bottom: none; }
  .cap-bucket { color: var(--text-dimmer); font-size: 10.5px; text-transform: uppercase; margin: 10px 0 2px; }

  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: flex; gap: 10px; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--border); }
  .timeline li:last-child { border-bottom: none; }
  .timeline .mark { width: 16px; flex-shrink: 0; text-align: center; }
  .timeline .mark.ok { color: var(--green); }
  .timeline .mark.fail { color: var(--red); }
  .timeline .mark.info { color: var(--text-dimmer); }
  .timeline .ts { color: var(--text-dimmer); font-size: 11.5px; margin-left: auto; white-space: nowrap; padding-left: 10px; }
  .timeline .empty { color: var(--text-dimmer); font-style: italic; padding: 6px 0; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .btn { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 13px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.warn { background: var(--amber-bg); border-color: rgba(245,158,11,0.5); color: #ffcb7a; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.pdf { background: var(--green-bg); border-color: rgba(34,197,94,0.4); color: #7fe3a4; text-decoration: none; display: inline-block; }
  .action-note { color: var(--text-dimmer); font-size: 12px; margin-top: 10px; }

  .next-action { font-weight: 600; }
  .next-action.hot { color: #ff8080; }
  .next-action.warm { color: #ffcb7a; }

  .loading, .error-msg { color: var(--text-dim); padding: 40px; text-align: center; }
  .error-msg { color: #ff8080; }
</style>
</head>
<body>
<header>
  <h1>Scrolly Order Monitoring</h1>
  <div class="sub" id="subhead">Internal operator dashboard — reads clients/*/order.json + a read-only WooCommerce lookup. Not customer-facing.</div>
</header>
<main id="app">
  <div class="loading">Loading...</div>
</main>

<script>
const $app = document.getElementById('app');
const $sub = document.getElementById('subhead');

const STATUS_LABEL = {
  paid: 'Paid',
  awaiting_intake: 'Awaiting Intake',
  ready_to_run: 'Ready to Run',
  running: 'Running',
  needs_attention: 'Needs Attention',
  awaiting_final_review: 'Awaiting Final Review',
  approved: 'Approved',
  delivering: 'Delivering',
  delivered: 'Delivered',
};

const CUSTOMER_STATUS_LABEL = {
  intake_required: 'Information needed',
  information_received: 'Information received',
  analysis_in_progress: 'Analysis in progress',
  in_final_review: 'Final review',
  action_required: 'Action needed',
  ready: 'Report ready',
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function fmtMoney(n) {
  return n != null ? '$' + Number(n).toFixed(2) : '<span class="muted">Unknown</span>';
}
function statusBadge(row) {
  // review-required is derived presentation, not a real status value — the
  // underlying order.status stays 'needs_attention' everywhere else.
  if (row.reviewRequired) return `<span class="badge badge-review_required"><span class="dot"></span>Review Required</span>`;
  const label = STATUS_LABEL[row.status] || row.status;
  return `<span class="badge badge-${esc(row.status)}"><span class="dot"></span>${esc(label)}</span>`;
}
function customerStatusText(row) {
  const cs = row.wpSync && row.wpSync.customerStatus;
  if (!cs) return '<span class="muted">not synced</span>';
  return esc(CUSTOMER_STATUS_LABEL[cs] || cs);
}
function currentStepText(row) {
  if (row.currentStep && row.currentStep.label) return esc(row.currentStep.label);
  if (row.status === 'needs_attention' && row.lastCheckpoint) {
    return `<span class="approx">${row.lastCheckpoint.approximate ? 'approx. ' : ''}last: ${esc(row.lastCheckpoint.step)}</span>`;
  }
  return '<span class="muted">—</span>';
}
function automationText(row) {
  if (row.status === 'awaiting_intake' || row.status === 'paid') return '<span class="muted">Not started</span>';
  if (row.status === 'ready_to_run') return '<span class="muted">Queued</span>';
  if (['awaiting_final_review', 'approved', 'delivering', 'delivered'].includes(row.status)) return '<span class="pill pill-ok">Complete</span>';
  if (row.status === 'needs_attention') {
    return row.reviewRequired
      ? '<span class="pill pill-warn">Analysis completed — review required</span>'
      : '<span class="pill pill-fail">Stopped — see failure</span>';
  }
  return currentStepText(row); // running
}
function qaText(row) {
  if (['awaiting_final_review', 'approved', 'delivering', 'delivered'].includes(row.status)) return '<span class="pill pill-ok">Gate passed</span>';
  if (row.status === 'needs_attention') {
    if (row.reviewRequired) return '<span class="pill pill-warn">Completeness check needs review</span>';
    const label = row.failure && row.failure.errorClass === 'completeness_gate_failed' ? 'Gate failed' : 'Run failed';
    return `<span class="pill pill-fail">${label}</span>`;
  }
  return '<span class="pill pill-pending">Pending</span>';
}
function deliveryText(row) {
  if (row.status === 'delivered' && row.delivery && row.delivery.deliveredAt) return `<span class="pill pill-ok">Delivered ${fmtTime(row.delivery.deliveredAt)}</span>`;
  return '<span class="muted">Not delivered</span>';
}
function attentionFlag(row) {
  if (row.reviewRequired) return '<span class="attention-flag" style="color:var(--amber)" title="Report ready — needs your review, not a broken run">●</span>';
  if (row.operatorActionRequired || row.runningUnusuallyLong) return '<span class="attention-flag" title="Requires operator attention">●</span>';
  if (row.customerActionRequired) return '<span class="attention-flag" style="color:var(--purple)" title="Waiting on the customer">●</span>';
  return '';
}
function nextActionText(row) {
  const cls = row.reviewRequired ? 'warm' : row.priorityTier <= 1 ? 'hot' : row.priorityTier === 2 || row.priorityTier === 3 ? 'warm' : '';
  return `<span class="next-action ${cls}">${esc(row.nextAction)}</span>`;
}
function costText(row) {
  const anthropic = row.costUsd != null ? fmtMoney(row.costUsd) : '<span class="muted">Unknown</span>';
  const dfs = row.dataforseoCallsUsed != null ? `${row.dataforseoCallsUsed} calls` : '<span class="muted">—</span>';
  return `${anthropic}<br><span class="muted" style="font-size:11px;">DFS: ${dfs} (cost n/a)</span>`;
}

async function getJSON(url) {
  const res = await fetch(url);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}
async function postJSON(url, payload) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

function route() {
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  if (slug) return renderDetail(slug);
  return renderList();
}
window.addEventListener('popstate', route);

// --- List view ---------------------------------------------------------
async function renderList() {
  $sub.textContent = 'Internal operator dashboard — reads clients/*/order.json + a read-only WooCommerce lookup. Not customer-facing.';
  $app.innerHTML = '<div class="loading">Loading orders…</div>';
  let data;
  try {
    data = await getJSON('/orders');
  } catch (err) {
    $app.innerHTML = `<div class="error-msg">Could not load orders: ${esc(err.message)}</div>`;
    return;
  }

  const c = data.counts;
  const cards = [
    ['openOrders', 'Open Orders', ''],
    ['awaitingIntake', 'Awaiting Intake', ''],
    ['running', 'Running', 'running'],
    ['needsAttention', 'Needs Attention', 'needs-attention'],
    ['awaitingApproval', 'Awaiting Approval', 'awaiting-approval'],
    ['deliveredToday', 'Delivered Today', ''],
  ];
  const cardsHtml = cards.map(([key, label, cls]) =>
    `<div class="card ${cls}"><div class="n">${c[key]}</div><div class="l">${label}</div></div>`
  ).join('');

  const rowsHtml = data.orders.length
    ? data.orders.map((o) => `
      <tr class="tier-${o.priorityTier} row-click" onclick="location.search='?slug=${encodeURIComponent(o.slug)}'">
        <td>${attentionFlag(o)}</td>
        <td class="mono">${esc(o.orderId || o.slug)}</td>
        <td class="wrap">${esc(o.businessName || o.slug)}</td>
        <td class="muted">${esc(o.product)}</td>
        <td class="muted mono">${fmtTime(o.purchaseDate)}</td>
        <td>${statusBadge(o)}</td>
        <td>${customerStatusText(o)}</td>
        <td>${automationText(o)}</td>
        <td>${qaText(o)}</td>
        <td>${deliveryText(o)}</td>
        <td>${costText(o)}</td>
        <td class="muted mono">${o.elapsedInStage ? o.elapsedInStage.text : '—'}</td>
        <td class="muted mono">${fmtTime(o.lastActivity)}</td>
        <td class="wrap">${nextActionText(o)}</td>
        <td><a class="link" href="?slug=${encodeURIComponent(o.slug)}" onclick="event.stopPropagation()">View</a></td>
      </tr>
    `).join('')
    : '<tr><td colspan="15" class="muted" style="text-align:center;padding:30px;">No orders with order.json yet.</td></tr>';

  $app.innerHTML = `
    <div class="cards">${cardsHtml}</div>
    <div class="table-scroll">
    <table>
      <thead><tr>
        <th></th><th>Order</th><th>Customer</th><th>Product</th><th>Purchased</th>
        <th>Internal Status</th><th>Customer-Facing</th><th>Automation</th><th>QA</th><th>Delivery</th>
        <th>Cost</th><th>Age in Stage</th><th>Last Updated</th><th>Next Action</th><th></th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    </div>
  `;
}

// --- Detail view ---------------------------------------------------------
const EVENT_ICON = { run_started: 'ok', step_started: 'ok', step_completed: 'ok', failed: 'fail', ready_for_review: 'ok', intake_received: 'ok', approved: 'ok', delivered: 'ok', wp_synced: 'info', wp_sync_failed: 'fail', wp_sync_skipped: 'info' };
const EVENT_LABEL = {
  run_started: 'Run started',
  step_started: (e) => `Step: ${e.label || e.step}`,
  step_completed: (e) => `Step complete: ${e.label || e.step}`,
  failed: (e) => `Failed — ${e.errorClass || 'error'}`,
  ready_for_review: 'Ready for final review',
  intake_received: 'Intake received',
  approved: 'Approved',
  delivered: 'Delivered',
  wp_synced: (e) => `Tracker synced — ${e.customerStatus || ''}`,
  wp_sync_failed: 'Tracker sync failed',
  wp_sync_skipped: (e) => `Tracker sync skipped (${e.reason || ''})`,
};

function renderTimeline(events) {
  if (!events || events.length === 0) {
    return '<div class="empty">No events recorded yet for this order (order-events.ndjson empty or not yet created).</div>';
  }
  return '<ul class="timeline">' + events.map((e) => {
    const mark = EVENT_ICON[e.type] || 'info';
    const symbol = mark === 'ok' ? '✓' : mark === 'fail' ? '✕' : '·';
    const labelFn = EVENT_LABEL[e.type];
    const label = typeof labelFn === 'function' ? labelFn(e) : (labelFn || e.type);
    return `<li><span class="mark ${mark}">${symbol}</span><span>${esc(label)}</span><span class="ts">${fmtTime(e.at)}</span></li>`;
  }).join('') + '</ul>';
}

function reportSection(order) {
  if (!order.reportAvailable && !order.appendixAvailable) {
    return '<p class="muted">Report: Not available for this run.</p>';
  }
  const slug = encodeURIComponent(order.slug);
  let html = '<div class="actions">';
  if (order.reportAvailable) html += `<a class="btn pdf" href="/report-file?slug=${slug}&type=report" target="_blank" rel="noopener">Open Report (PDF)</a>`;
  if (order.appendixAvailable) html += `<a class="btn pdf" href="/report-file?slug=${slug}&type=appendix" target="_blank" rel="noopener">Open Appendix (PDF)</a>`;
  html += '</div>';
  return html;
}

function capabilitiesSection(capabilities) {
  if (!capabilities || capabilities.length === 0) return '<p class="muted">No DataForSEO call log recorded for this engagement yet.</p>';
  const STATUS_PILL = { succeeded: '<span class="pill pill-ok">OK</span>', attempted_failed: '<span class="pill pill-fail">Failed</span>', not_attempted: '<span class="pill pill-pending">N/A</span>' };
  let lastBucket = null;
  let html = '<ul class="cap-list">';
  for (const c of capabilities) {
    if (c.bucket !== lastBucket) {
      html += `<div class="cap-bucket">${esc(c.bucket)}</div>`;
      lastBucket = c.bucket;
    }
    html += `<li><span>${esc(c.label)}</span>${STATUS_PILL[c.status] || c.status}</li>`;
  }
  return html + '</ul>';
}

function failurePanel(order) {
  if (order.status !== 'needs_attention' || !order.failure) return '';
  const f = order.failure;
  const review = order.reviewRequired;
  const heading = review ? 'Quality Review' : 'Failure';
  const summary = review
    ? '<p class="review-summary">The report and appendix were generated successfully. One internal completeness check did not pass and needs your review before this can be approved and sent. Technical detail is below if you want to inspect it.</p>'
    : '';
  return `
    <div class="panel ${review ? 'review' : 'fail'}">
      <h2>${heading}</h2>
      ${summary}
      <dl class="kv">
        <dt>Failed step</dt><dd>${esc((order.lastCheckpoint && order.lastCheckpoint.step) || 'unknown')}${order.lastCheckpoint && order.lastCheckpoint.approximate ? ' <span class="approx">(approximate)</span>' : ''}</dd>
        <dt>Error class</dt><dd><code>${esc(f.errorClass)}</code></dd>
        <dt>Message</dt><dd>${esc(f.message)}</dd>
        <dt>Report draft exists?</dt><dd>${order.reportAvailable ? 'Yes' : 'No'}</dd>
        <dt>Customer action required</dt><dd>${f.customerActionRequired ? 'Yes' : 'No'}</dd>
        <dt>Retry available</dt><dd>${f.retryAvailable ? 'Yes (manual only — not triggered from here)' : 'No'}</dd>
        <dt>Occurred</dt><dd>${fmtTime(f.occurredAt)}</dd>
        <dt>Recommended next action</dt><dd><strong>${esc(order.nextAction)}</strong></dd>
      </dl>
    </div>`;
}

async function approveAndSend(slug, businessName, contactEmail) {
  const ok = confirm(`This will actually email the finished report + appendix PDFs to ${contactEmail || '(no email on file)'} for ${businessName || slug}, and mark the order Delivered once that email is confirmed sent. This cannot be undone from here. Continue?`);
  if (!ok) return;
  const btn = document.getElementById('approve-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  try {
    await postJSON('/approve-and-send', { slug });
    alert('Sent. The order is now marked Delivered.');
    renderDetail(slug);
  } catch (err) {
    alert('Approve & Send failed: ' + err.message + '\n\nNothing was approved or delivered — the order is unchanged and safe to retry once the issue is fixed.');
    renderDetail(slug); // reload so any recorded delivery-failure detail shows below, not just this alert
  }
}
window.__scrollyApproveAndSend = approveAndSend;

async function acceptReview(slug, businessName) {
  const ok = confirm(
    `This manually accepts the flagged completeness-check issue for ${businessName || slug} after your own review of the report and appendix.\n\n` +
    `It will move this order from Needs Attention / Review Required to Awaiting Final Review, making Approve & Send available. ` +
    `It does NOT send anything, and the original technical failure detail stays recorded for audit.\n\nContinue?`
  );
  if (!ok) return;
  const btn = document.getElementById('accept-review-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Accepting…'; }
  try {
    await postJSON('/accept-review-and-continue', { slug });
    renderDetail(slug);
  } catch (err) {
    alert('Accept Review & Continue failed: ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Accept Review & Continue'; }
  }
}
window.__scrollyAcceptReview = acceptReview;

async function renderDetail(slug) {
  $sub.textContent = slug;
  $app.innerHTML = '<div class="loading">Loading order…</div>';
  let data;
  try {
    data = await getJSON('/order-detail?slug=' + encodeURIComponent(slug));
  } catch (err) {
    $app.innerHTML = `<a class="link back" href="?">&larr; Back to all orders</a><div class="error-msg">Could not load order "${esc(slug)}": ${esc(err.message)}</div>`;
    return;
  }
  const o = data.order;

  const canApprove = o.status === 'awaiting_final_review';

  $app.innerHTML = `
    <a class="link back" href="?">&larr; Back to all orders</a>

    <div class="panel">
      <div class="state-row">
        <div class="state-item"><div class="l">Internal Status</div><div class="v">${statusBadge(o)}</div></div>
        <div class="state-item"><div class="l">Customer-Facing</div><div class="v">${customerStatusText(o)}</div></div>
        <div class="state-item"><div class="l">Next Operator Action</div><div class="v">${nextActionText(o)}</div></div>
        <div class="state-item"><div class="l">Last Activity</div><div class="v mono">${fmtTime(o.timestamps && o.timestamps.updatedAt)}</div></div>
      </div>
    </div>

    ${failurePanel(o)}

    <div class="detail-grid">
      <div>
        <div class="panel">
          <h2>Commerce</h2>
          <dl class="kv">
            <dt>WooCommerce order #</dt><dd class="mono">${esc(o.orderId || '—')}</dd>
            <dt>Product</dt><dd>${esc(o.product)}</dd>
            <dt>Customer / business</dt><dd>${esc(o.businessName || '—')}</dd>
            <dt>Contact</dt><dd>${esc(o.contactName || '—')} &lt;${esc(o.contactEmail || '—')}&gt;</dd>
            <dt>Purchase date</dt><dd class="mono">${fmtTime(o.purchaseDate)}</dd>
            <dt>WooCommerce order/payment status</dt><dd>${o.wcOrderStatus ? esc(o.wcOrderStatus) + (o.wcTotal ? ' — $' + esc(o.wcTotal) : '') : '<span class="muted">Unknown (WooCommerce lookup unavailable)</span>'}</dd>
          </dl>
        </div>

        <div class="panel">
          <h2>Intake</h2>
          <dl class="kv">
            <dt>Intake received?</dt><dd>${o.timestamps && o.timestamps.createdAt ? 'Yes' : 'No'}</dd>
            <dt>Intake timestamp</dt><dd class="mono">${fmtTime(o.timestamps && o.timestamps.createdAt)}</dd>
            <dt>Source intake data</dt><dd><span class="muted">clients/${esc(o.slug)}/discover/input.md (internal file, not linked here)</span></dd>
          </dl>
        </div>

        <div class="panel">
          <h2>Automation</h2>
          <dl class="kv">
            <dt>Queued / run started</dt><dd class="mono">${fmtTime(o.timestamps && o.timestamps.runStartedAt)}</dd>
            <dt>Current internal state</dt><dd>${statusBadge(o)}</dd>
            <dt>Current step</dt><dd>${currentStepText(o)}</dd>
            <dt>Completion result</dt><dd>${automationText(o)}</dd>
            <dt>Failure / error class</dt><dd>${o.failure ? '<code>' + esc(o.failure.errorClass) + '</code>' : '<span class="muted">None</span>'}</dd>
            <dt>Retry available</dt><dd>${o.failure ? (o.failure.retryAvailable ? 'Yes (manual only)' : 'No') : '<span class="muted">N/A</span>'}</dd>
          </dl>
          <div class="cap-list-wrap">
            <div class="cap-bucket" style="margin-top:14px;">DataForSEO capability results</div>
            ${capabilitiesSection(data.capabilities)}
          </div>
        </div>

        <div class="panel">
          <h2>QA</h2>
          <dl class="kv">
            <dt>Report draft exists?</dt><dd>${o.reportAvailable ? 'Yes' : 'No'}</dd>
            <dt>Appendix draft exists?</dt><dd>${o.appendixAvailable ? 'Yes' : 'No'}</dd>
            <dt>Completeness gate</dt><dd>${qaText(o)}</dd>
            <dt>Awaiting final review?</dt><dd>${o.status === 'awaiting_final_review' ? 'Yes' : 'No'}</dd>
            <dt>Approval status</dt><dd>${o.approval && o.approval.approvedAt ? 'Approved' : '<span class="muted">Not yet approved</span>'}</dd>
            <dt>Approved at</dt><dd class="mono">${fmtTime(o.approval && o.approval.approvedAt)}</dd>
            <dt>Approved by</dt><dd>${esc((o.approval && o.approval.approvedBy) || '—')}</dd>
          </dl>
        </div>

        <div class="panel">
          <h2>Delivery</h2>
          <dl class="kv">
            <dt>Delivery status</dt><dd>${deliveryText(o)}</dd>
            <dt>Delivered at</dt><dd class="mono">${fmtTime(o.delivery && o.delivery.deliveredAt)}</dd>
            <dt>Delivery method</dt><dd>${esc((o.delivery && o.delivery.method) || '—')}</dd>
            <dt>Customer-facing projection</dt><dd>${customerStatusText(o)} — <span class="muted">${esc((o.wpSync && o.wpSync.customerMessage) || 'not synced')}</span></dd>
          </dl>
          ${o.lastDeliveryFailure ? `
          <div class="review-summary" style="color:#ff8080; margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);">
            <strong>Last delivery attempt failed</strong> (${esc(fmtTime(o.lastDeliveryFailure.occurredAt))}) — nothing was approved or delivered; the report was never emailed.<br>
            <span class="mono">${esc(o.lastDeliveryFailure.reason)}</span>: ${esc(o.lastDeliveryFailure.message)}
          </div>` : ''}
        </div>

        <div class="panel">
          <h2>Cost</h2>
          <dl class="kv">
            <dt>Anthropic cost</dt><dd>${fmtMoney(o.costUsd)}</dd>
            <dt>DataForSEO calls used</dt><dd>${o.dataforseoCallsUsed != null ? o.dataforseoCallsUsed : '<span class="muted">Unknown</span>'}</dd>
            <dt>DataForSEO cost</dt><dd><span class="muted">Not tracked structurally yet — data gap, not $0</span></dd>
            <dt>Total report-generation cost</dt><dd>${o.costUsd != null ? fmtMoney(o.costUsd) + ' <span class="muted">(Anthropic only — DataForSEO portion unknown)</span>' : '<span class="muted">Unknown</span>'}</dd>
          </dl>
        </div>

        <div class="panel">
          <h2>Report</h2>
          ${reportSection(o)}
        </div>

        <div class="panel">
          <h2>Actions</h2>
          <div class="actions">
            ${o.reviewRequired ? `
            <button id="accept-review-btn" class="btn warn" title="Manually accept the flagged completeness check after reviewing the report yourself"
              onclick="window.__scrollyAcceptReview('${esc(o.slug)}', '${esc((o.businessName||'').replace(/'/g,"\\'"))}')">
              Accept Review &amp; Continue
            </button>` : ''}
            <button id="approve-btn" class="btn primary" ${canApprove ? '' : 'disabled'} title="${canApprove ? 'Send the finished report to the customer' : 'Only available when the order is awaiting final review'}"
              onclick="window.__scrollyApproveAndSend('${esc(o.slug)}', '${esc((o.businessName||'').replace(/'/g,"\\'"))}', '${esc(o.contactEmail||'')}')">
              Approve &amp; Send${canApprove ? '' : ' (n/a)'}
            </button>
          </div>
          ${o.reviewRequired ? '<p class="action-note">Accept Review &amp; Continue moves this order to Awaiting Final Review so Approve &amp; Send becomes available. It does not send anything itself, and the original completeness-check failure stays recorded below for audit — it is never cleared.</p>' : ''}
          <p class="action-note">Approve &amp; Send uses the real approval/delivery pipeline (same email + PDF attachments the token-based flow sends) and is only enabled when the order is genuinely "Awaiting Final Review." Retry is not wired here — today that still means manually re-running <code>node runner/run-discover.mjs ${esc(o.slug)}</code>.</p>
        </div>
      </div>

      <div class="panel">
        <h2>Timeline</h2>
        ${renderTimeline(data.events)}
      </div>
    </div>
  `;
}

route();
</script>
</body>
</html>
