# Two attempts before this one, both empirically confirmed NOT to work on
# this image (tested directly with curl -u against /wp-json/wp/v2/users/me):
#   1. CGIPassAuth On — only affects CGI/FastCGI SAPIs; this image uses
#      mod_php, not CGI, so it had no effect.
#   2. SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1 — sets an Apache
#      subprocess env var, but that didn't reliably propagate into PHP's
#      $_SERVER on this image/module combination either.
# This mod_rewrite-based approach (RewriteRule's [E=...] flag) is the one
# most consistently cited for this exact "Basic Auth / Application Passwords
# silently not authenticating under Apache+mod_php" symptom — confirmed
# working here. mod_rewrite is already enabled (WordPress's own pretty
# permalinks depend on it and those already work).
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTP:Authorization} ^(.*)
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
</IfModule>
