<!doctype html><html><head><meta charset="utf-8"><title>Fall motion tests</title><style>
body{margin:0;padding:16px 20px 90px;background:#f1ece4;font:15px Arial,sans-serif;color:#1b1a19}
h1{font-size:22px;margin:0 0 4px} h2{font-size:19px;margin:0 0 6px} h2 small{font-weight:normal;color:#6b645c;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:24px;margin-top:16px}
.card{background:#fff;border-radius:10px;padding:14px;width:340px}
video{width:340px;border-radius:8px;display:block;background:#000}
ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:#3a3530}
textarea{width:100%;box-sizing:border-box;height:110px;font:14px Arial;padding:6px;border:1px solid #c9bfb2;border-radius:6px;margin-top:8px}
.ok{font-weight:bold;display:block;margin-top:8px}
#bar{position:fixed;left:0;right:0;bottom:0;background:#1b1a19;color:#fff;padding:12px 20px;display:flex;gap:14px;align-items:center}
button{font:bold 15px Arial;padding:10px 18px;border:0;border-radius:6px;background:#ec7824;color:#fff;cursor:pointer}
</style></head><body><h1>Fall pack motion tests</h1>
<p>Rough tests with stand-in footage (your July clips stand in for the buyer's product clips). Watch, then tick Approved or type notes. Notes save as you type and reach Claude.</p>
<div class="row" id="row"></div>
<div id="bar"><button id="save">Send notes to Claude</button><span id="msg"></span></div>
<script>
const T=[
 {id:'f9',name:'Traced',job:'New product launch',src:'../f9-traced/preview/motion-test.mp4',
  beats:['0-2.4 s: white marker traces the real tree trunks as you watch; NEW FOR FALL (leaf-filled letters)',
         '2.4-5.2 s: 3 product clips slide up as tall strips, outlined in the same marker; fog drifts, leaves fall',
         '5.2-5.6 s: the fog rolls in thick (transition)',
         '5.6-7.2 s: text only, LIMITED RUN, underline draws itself',
         '7.2-8 s: the forest splits along a traced trunk like curtains: the product clip is behind it',
         '8-10 s: product clip full screen, burst doodle + "only 50 made"',
         '10-12 s: curtains close part way, clip stays in the gap, COMMENT NEW']},
];
const row=document.getElementById('row'), msg=document.getElementById('msg');
T.forEach(t=>{const c=document.createElement('div');c.className='card';
 c.innerHTML=`<h2>${t.id} ${t.name} <small>${t.job}</small></h2><video src="${t.src}" controls loop playsinline></video>
 <ul>${t.beats.map(b=>`<li>${b}</li>`).join('')}</ul>
 <label class="ok"><input type="checkbox" data-k="${t.id} APPROVED"> Approved</label>
 <textarea data-k="${t.id} notes" placeholder="Notes on ${t.id}"></textarea>`;row.appendChild(c)});
const els=[...document.querySelectorAll('textarea,input[type=checkbox]')];
const val=e=>e.type==='checkbox'?(e.checked?'yes':''):e.value.trim();
els.forEach(e=>{try{const v=localStorage.getItem('fm1:'+e.dataset.k);if(v!==null){if(e.type==='checkbox')e.checked=v==='yes';else e.value=v}}catch(x){}
 const h=()=>{try{localStorage.setItem('fm1:'+e.dataset.k,val(e))}catch(x){};clearTimeout(window._s);window._s=setTimeout(send,600)};e.oninput=h;e.onchange=h});
function send(){const o={};els.forEach(e=>{if(val(e))o[e.dataset.k]=val(e)});
 fetch('/notes?to=fall/motion/notes.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(r=>{msg.textContent=r.ok?'Notes saved. Claude can read them.':'Could not save notes.'}).catch(()=>{msg.textContent='Could not save notes.'})}
document.getElementById('save').onclick=send;
</script></body></html>
