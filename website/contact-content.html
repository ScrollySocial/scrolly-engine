<style>
  :root{
    --bg-alt:#eef1fa; --surface:#ffffff; --ink:#10152b; --ink-soft:#5c6478; --line:#e1e5f2;
    --indigo:#4f46e5; --indigo-dark:#3c34b5; --indigo-bg:#edeafe;
  }
  .contact-wrap{max-width:720px;margin:0 auto;padding:72px 24px 96px;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);line-height:1.65;}
  .contact-wrap h1,.contact-wrap h2,.contact-wrap h3{font-family:"Manrope",sans-serif;font-weight:800;line-height:1.15;letter-spacing:-.02em;color:var(--ink);}
  .contact-wrap h1{font-size:clamp(2rem,4vw,2.6rem);margin:0 0 .4em;}
  .contact-wrap h2{font-size:1.4rem;margin:1.6em 0 .5em;}
  .contact-eyebrow{display:inline-block;font-family:"Manrope",sans-serif;font-size:.95rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--indigo);margin-bottom:16px;}
  .contact-lede{font-size:1.1rem;color:var(--ink-soft);margin-bottom:1.2em;}
  .contact-wrap p{margin:0 0 1em;}
  .contact-wrap a{color:var(--indigo);font-weight:600;text-decoration:underline;text-decoration-color:var(--indigo-bg);text-underline-offset:2px;}
  .contact-wrap a:hover{text-decoration-color:var(--indigo);}
  .contact-card{background:var(--bg-alt);border-radius:16px;padding:28px 32px;margin:1.6em 0;}
  .contact-card h3{font-size:1.05rem;margin:0 0 8px;}
  .contact-card .email{font-family:"Manrope",sans-serif;font-weight:800;font-size:1.15rem;color:var(--indigo);text-decoration:none;}
  .contact-card .email:hover{text-decoration:underline;}
</style>

<div class="contact-wrap">
  <div class="contact-eyebrow">Contact</div>
  <h1>Get in Touch</h1>
  <p class="contact-lede">Questions about the SEO Site Audit, the workbooks, or an existing order? Email us and we'll get back to you.</p>

  <div class="contact-card">
    <h3>Email</h3>
    <a class="email" href="mailto:hello@scrollyseo.com">hello@scrollyseo.com</a>
  </div>

  <h2>Before you email</h2>
  <p>Most questions about pricing, delivery, and what's included in the SEO Site Audit are answered on the <a href="https://scrollyseo.com/#faq">FAQ</a>.</p>
</div>
