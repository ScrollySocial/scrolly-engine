<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inbox</title>
<style>
  /* Neutral defaults; applyProfile() swaps in the owner's colors and fonts from config/profile.json
     (Mercedes's: Scrolly v3, vault brand/visual-system.md). Private tool, so no site header/footer. */
  :root {
    --cream: #f6f4f0; --ink: #1d1d1f; --sky: #2f6fed; --sky-ink: #ffffff; --mist: #e4e6ee; --muted: #55555c;
    --line: #d9d6d0; --input: #8f8a83; --white: #fff; --bad: #b3261e; --good: #1d6b40;
    --body-font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --head-font: Georgia, serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font: 16px/1.5 var(--body-font); }
  main { max-width: 820px; margin: 0 auto; padding: 16px 16px 80px; }
  h1, h2, h3 { font-family: var(--head-font); font-weight: 400; letter-spacing: -0.01em; margin: 0; }
  h1 { font-size: 2.1rem; }
  h2 { font-size: 1.7rem; }
  h3 { font-size: 1.35rem; margin-bottom: 6px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 12px; }
  .tabs, .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }
  .tabs::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  .tabs button, .chips button { flex: none; border: 0; border-radius: 999px; padding: 8px 16px; background: var(--mist); color: var(--ink); font: 500 15px var(--body-font); cursor: pointer; }
  .tabs button[aria-current="true"], .chips button[aria-pressed="true"] { background: var(--ink); color: var(--white); }
  .chips button { padding: 5px 12px; font-size: 14px; }
  .count { display: inline-block; min-width: 1.4em; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--sky); color: var(--sky-ink); font-size: 13px; text-align: center; }
  /* email-style list */
  .list { background: var(--white); border-radius: 18px; overflow: hidden; }
  .item { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; width: 100%; text-align: left; border: 0; border-radius: 0; border-bottom: 1px solid var(--line); background: none; padding: 14px 16px; cursor: pointer; font: inherit; color: inherit; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: #fbf9f5; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; background: transparent; }
  .item.unread .dot { background: var(--sky); }
  .icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-top: 1px; }
  .item.unread .icon { color: var(--ink); }
  .item:not(.unread) .icon { color: var(--muted); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; margin-bottom: 12px; }
  .flt { display: flex; flex-direction: column; min-width: 130px; flex: 1 1 130px; }
  .flt label { margin: 0 0 2px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .flt select { padding: 7px 10px; font-size: 15px; }
  .flt-check { flex: 1 1 100%; margin: 2px 0 0; font-size: 15px; }
  .filter-box { margin-bottom: 12px; }
  .filter-box summary { display: inline-block; cursor: pointer; border-radius: 999px; padding: 7px 16px; background: var(--mist); font-weight: 500; font-size: 15px; list-style: none; margin-bottom: 10px; }
  .filter-box summary::-webkit-details-marker { display: none; }
  .filter-box[open] summary { background: var(--ink); color: var(--white); }
  @media (min-width: 700px) { .filter-box summary { display: none; } }
  .chart { display: flex; align-items: flex-end; gap: 2px; height: 90px; margin-top: 8px; }
  .chart span { flex: 1; background: var(--sky); border-radius: 3px 3px 0 0; min-height: 2px; }
  .chart-axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .from { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.unread .from { font-weight: 600; }
  .when { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .preview { grid-column: 2 / 4; color: var(--muted); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.unread .preview { color: var(--ink); }
  .tags { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { border-radius: 999px; padding: 1px 10px; background: var(--mist); color: var(--ink); font-size: 13px; font-weight: 500; }
  .pill.sky { background: var(--sky); color: var(--sky-ink); }
  .pill.on { background: #d5ecdd; color: var(--good); }
  /* conversation */
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin: 8px 0 14px; }
  .thread { display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 86%; border-radius: 18px; padding: 10px 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .bubble.them { align-self: flex-start; background: var(--white); }
  .bubble.me { align-self: flex-end; background: var(--ink); color: var(--white); }
  .bubble .meta { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
  .bubble.me .meta { color: var(--mist); }
  .bubble.me a { color: var(--white); }
  .sys { align-self: center; font-size: 13px; color: var(--muted); background: var(--mist); border-radius: 999px; padding: 2px 12px; text-align: center; }
  .compose { background: var(--white); border-radius: 18px; padding: 14px; }
  .compose .label { font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  /* forms */
  .card { background: var(--white); border-radius: 18px; padding: 16px; margin: 0 0 12px; }
  label { display: block; font-size: 15px; font-weight: 500; margin: 12px 0 4px; }
  .hint { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
  .warn { font-size: 14px; color: var(--bad); margin: 6px 0 0; }
  textarea, input[type=text], input[type=url], input[type=number], input[type=password], select { width: 100%; border: 1px solid var(--input); border-radius: 12px; padding: 10px 12px; font: 16px/1.4 var(--body-font); color: var(--ink); background: var(--white); }
  textarea { min-height: 90px; resize: vertical; }
  input[type=number] { width: 110px; }
  .check { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; font-weight: 400; }
  .check input { width: 20px; height: 20px; accent-color: var(--sky); flex: none; margin: 0; }
  .toggle { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; margin: 0; }
  .toggle input { appearance: none; width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
  .toggle input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--white); transition: left .15s; }
  .toggle input:checked { background: var(--sky); }
  .toggle input:checked::after { left: 23px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .radio { display: grid; gap: 8px; margin-top: 8px; }
  .radio label { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin: 0; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .radio input { accent-color: var(--sky); width: 18px; height: 18px; margin-top: 3px; flex: none; }
  .preview-box { background: var(--mist); border-radius: 12px; padding: 10px 12px; font-size: 15px; margin-top: 8px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .between { justify-content: space-between; }
  button { border: 0; border-radius: 999px; padding: 10px 18px; font: 500 16px var(--body-font); cursor: pointer; background: var(--mist); color: var(--ink); }
  button.primary { background: var(--sky); color: var(--sky-ink); }
  button.quiet { background: transparent; text-decoration: underline; padding: 10px 6px; }
  button.danger { background: transparent; color: var(--bad); text-decoration: underline; padding: 10px 6px; }
  button:disabled { opacity: .5; cursor: default; }
  a.button { display: inline-block; border-radius: 999px; padding: 10px 18px; background: var(--mist); color: var(--ink); text-decoration: none; font-weight: 500; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .item:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  a { color: var(--ink); }
  .empty { color: var(--muted); padding: 28px 16px; text-align: center; }
  .funnel { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
  .funnel div { background: var(--mist); border-radius: 12px; padding: 8px 10px; }
  .big { font-family: var(--head-font); font-size: 2rem; line-height: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--white); padding: 10px 18px; border-radius: 999px; font-size: 15px; display: none; max-width: calc(100% - 32px); }
  /* "What they'll see": app-style previews (Instagram DMs and comments, YouTube comments) */
  .pv-phone { max-width: 380px; margin: 8px auto 0; border: 1px solid var(--line); border-radius: 26px; overflow: hidden; background: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #000; }
  .pv-ig-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #efefef; font-size: 15px; }
  .pv-ig-body { display: flex; flex-direction: column; gap: 8px; padding: 14px 12px 18px; }
  .pv-avatar { width: 28px; height: 28px; border-radius: 50%; background: #d9d9d9; flex: none; }
  .pv-avatar.brand { background: var(--ink); }
  .pv-row { display: flex; align-items: flex-end; gap: 8px; }
  .pv-row.me { justify-content: flex-end; }
  .pv-bubble { max-width: 250px; padding: 8px 12px; border-radius: 20px; font-size: 15px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pv-bubble.them { background: #efefef; color: #000; }
  .pv-bubble.me { background: #3797f0; color: #fff; }
  .pv-note { font-size: 12px; color: #737373; margin: 0 4px 2px; }
  .pv-sys { align-self: center; text-align: center; font-size: 12px; color: #737373; max-width: 280px; margin: 4px 0; }
  .pv-post { display: flex; gap: 10px; font-size: 14px; padding-bottom: 10px; border-bottom: 1px solid #efefef; }
  .pv-yt { padding: 14px; font-family: Roboto, system-ui, sans-serif; font-size: 14px; }
  .pv-yt-title { font-weight: 600; font-size: 16px; margin-bottom: 12px; }
  .pv-yt-c { display: flex; gap: 12px; margin-bottom: 12px; overflow-wrap: anywhere; }
  .pv-yt-c.reply { margin-left: 40px; }
  .pv-yt-name { font-size: 12px; color: #606060; margin-bottom: 2px; }
  .pv-avatar.round { width: 32px; height: 32px; }
  .welcome summary { cursor: pointer; font-size: 15px; }
  .emoji-wrap { position: relative; display: inline-block; }
  .emoji-toggle { padding: 8px 12px; font-size: 18px; line-height: 1; }
  .emoji-grid { position: absolute; z-index: 5; bottom: calc(100% + 6px); left: 0; width: 290px; max-width: calc(100vw - 48px); display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: 0 6px 24px rgba(10, 25, 48, .12); }
  .emoji-grid[hidden] { display: none; }
  .emoji { background: none; padding: 4px; font-size: 20px; border-radius: 8px; }
  .emoji:hover { background: var(--mist); }
  .login { max-width: 420px; margin: 12vh auto 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script>
// Everything that came from a commenter is put on the page with textContent, never as HTML.
const app = document.getElementById('app');
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === 'text') el.textContent = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
};
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.style.display = 'none'), 3200);
}
async function api(path, opts = {}) {
  const res = await fetch(`/inbox${path}`, { ...opts, headers: { 'Content-Type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { showLogin(true); throw new Error('Please log in.'); }
  if (!res.ok) throw new Error(data.error || `Something went wrong (${res.status})`);
  return data;
}
const ago = (iso) => {
  if (!iso) return '';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return `${Math.max(m, 1)}m`;
  if (m < 1440) return `${Math.round(m / 60)}h`;
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
};
const who = (c) => (c.author ? `@${c.author}` : 'Someone');
const kindLabel = (r) => (r.kind === 'dm' ? (String(r.note || '').startsWith('Story reply') ? 'Story reply' : 'DM') : r.kind === 'out' ? 'DM' : 'Comment');
const WAITING = ['New', 'Needs draft', 'Error', 'Reply by hand'];

// ---- login ----
function showLogin(passwordSet) {
  app.replaceChildren();
  const msg = h('p', { class: 'warn', role: 'alert' });
  const pw = h('input', { type: 'password', id: 'pw', autocomplete: passwordSet ? 'current-password' : 'new-password' });
  const code = h('input', { type: 'text', id: 'code', autocomplete: 'off' });
  const go = async (e) => {
    e.preventDefault();
    try {
      await api(passwordSet ? '/login' : '/setup', { method: 'POST', body: passwordSet ? { password: pw.value } : { code: code.value.trim(), password: pw.value } });
      route();
    } catch (err) { msg.textContent = err.message; }
  };
  app.append(h('form', { class: 'login card', on: { submit: go } },
    h('h1', { text: 'Inbox' }),
    passwordSet ? null : h('p', { class: 'hint', text: 'First visit: enter the setup code Claude gave you, then choose your password (save it in your password manager).' }),
    passwordSet ? null : [h('label', { for: 'code', text: 'Setup code' }), code],
    h('label', { for: 'pw', text: passwordSet ? 'Password' : 'New password (10+ characters)' }), pw,
    msg,
    h('div', { class: 'row' }, h('button', { class: 'primary', type: 'submit', text: passwordSet ? 'Log in' : 'Set password' }))));
  (passwordSet ? pw : code).focus();
}

// ---- routing: #inbox, #c/<key>, #keywords, #k/<KEYWORD>, #k/new, #stats ----

let stats = null;
let ME = {};
// The owner's name in the tab title, their colors and fonts (config/profile.json via /api/me).
let profileApplied = false;
function applyProfile(me) {
  const p = me.profile || {};
  document.title = p.brand ? `Inbox · ${p.brand}` : 'Inbox';
  if (profileApplied || !p.look) return;
  profileApplied = true;
  const L = p.look;
  const css = document.documentElement.style;
  const color = (v) => /^#[0-9a-f]{3,8}$/i.test(String(v || ''));
  for (const [v, key] of [['--cream', 'background'], ['--ink', 'text'], ['--muted', 'muted'], ['--sky', 'button'], ['--sky-ink', 'buttonText'], ['--white', 'card']]) if (color(L[key])) css.setProperty(v, L[key]);
  const font = (v) => String(v || '').replace(/[^A-Za-z0-9 -]/g, '').trim();
  if (font(L.bodyFont)) css.setProperty('--body-font', `'${font(L.bodyFont)}', system-ui, sans-serif`);
  if (font(L.headingFont)) css.setProperty('--head-font', `'${font(L.headingFont)}', Georgia, serif`);
  if (/^https:\/\/fonts\.googleapis\.com\/\S+$/.test(L.fontsUrl || '')) document.head.append(h('link', { rel: 'stylesheet', href: L.fontsUrl }));
}
// Where links in previews point (yourname.duckdns.org) and the Instagram handle shown in them.
const HOST = () => ME.publicHost || location.host;
const HANDLE = () => ME.profile?.handle || 'you';
const listWhere = () => (!ME.list || ['builtin', 'webhook'].includes(ME.list.id) ? 'your email list' : `your ${ME.list.name} list`);
async function route() {
  const me = await api('/api/me').catch(() => ({}));
  ME = me;
  if (!me.loggedIn) return showLogin(me.passwordSet);
  applyProfile(me);
  const hash = decodeURIComponent(location.hash.slice(1)) || 'inbox';
  stats = await api('/api/stats?days=30').catch(() => null);
  const tab = hash.startsWith('k') ? 'keywords' : hash === 'stats' ? 'stats' : hash === 'emails' ? 'emails' : 'inbox';
  const body = h('div');
  app.replaceChildren(
    h('div', { class: 'top' },
      h('h1', { text: { keywords: 'Keywords', stats: 'Stats', emails: 'Email list' }[tab] || 'Inbox' }),
      h('button', { class: 'quiet', text: 'Log out', on: { click: async () => { await api('/logout', { method: 'POST' }); showLogin(true); } } })),
    h('nav', { class: 'tabs', 'aria-label': 'Sections' },
      [['inbox', 'Inbox', stats?.inbox.unread], ['keywords', 'Keywords'], ['emails', 'Email list', me.waitingSignups], ['stats', 'Stats']].map(([id, label, n]) =>
        h('button', { 'aria-current': String(tab === id), on: { click: () => (location.hash = id) } }, label, n ? h('span', { class: 'count', text: n }) : null))),
    body);
  try {
    if (hash.startsWith('c/')) return await showConversation(body, hash.slice(2));
    if (hash === 'keywords') return await showKeywords(body);
    if (hash.startsWith('k/')) return await showKeyword(body, hash.slice(2));
    if (hash === 'stats') return await showStats(body);
    if (hash === 'emails') return await showEmailList(body);
    return await showInbox(body);
  } catch (e) { body.append(h('p', { class: 'warn', text: e.message })); }
}
window.addEventListener('hashchange', route);

// ---- platform icons (simple line icons in the page's ink colour) ----
const SVGNS = 'http://www.w3.org/2000/svg';
const ICONS = {
  Instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor"/>',
  YouTube: '<rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.2v5.6l5-2.8z" fill="currentColor"/>',
  TikTok: '<path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.6 2.2 4.2 5 4.4"/>',
};
function icon(platform) {
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('class', 'icon');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', platform);
  svg.innerHTML = `<title>${platform}</title>${ICONS[platform] || '<circle cx="12" cy="12" r="8"/>'}`;
  return svg;
}

// ---- inbox list ----
// Filters are remembered on this device only.
const saved = (() => { try { return JSON.parse(localStorage.getItem('inboxFilters') || '{}'); } catch { return {}; } })();
const filters = { show: 'all', platform: 'all', source: 'all', date: 'all', keywords: false, ...saved };
const keepFilters = () => { try { localStorage.setItem('inboxFilters', JSON.stringify(filters)); } catch {} };
const DATES = { today: 1, week: 7, month: 30 };
let filtersOpen = false;
function matches(r) {
  if (r.kind === 'out') return false;
  if (!filters.keywords && r.status === 'Handled') return false;
  if (filters.platform !== 'all' && r.platform !== filters.platform) return false;
  if (filters.source !== 'all' && kindLabel(r) !== filters.source) return false;
  if (filters.date !== 'all') {
    const since = filters.date === 'today' ? new Date(new Date().toDateString()) : new Date(Date.now() - DATES[filters.date] * 86400e3);
    if (new Date(r.receivedAt) < since) return false;
  }
  return true;
}
async function showInbox(body) {
  const { conversations } = await api('/api/conversations');
  const select = (key, label, options) => {
    const sel = h('select', { id: `flt-${key}`, 'aria-label': label }, options.map(([v, t]) => h('option', { value: v, text: t })));
    sel.value = filters[key];
    sel.addEventListener('change', () => { filters[key] = sel.value; keepFilters(); route(); });
    return h('div', { class: 'flt' }, h('label', { for: `flt-${key}`, text: label }), sel);
  };
  const kwBox = h('input', { type: 'checkbox', checked: filters.keywords });
  kwBox.addEventListener('change', () => { filters.keywords = kwBox.checked; keepFilters(); route(); });
  // On a phone the filters fold away behind one "Filters" button (open on wider screens).
  const active = ['show', 'platform', 'source', 'date'].filter((key) => filters[key] !== 'all').length + (filters.keywords ? 1 : 0);
  const box = h('details', { class: 'filter-box' },
    h('summary', { text: `Filters${active ? ` (${active} on)` : ''}` }),
    h('div', { class: 'filters' },
      select('show', 'Show', [['all', 'Everything'], ['reply', 'Needs a reply'], ['unread', 'Unread']]),
      select('platform', 'Platform', [['all', 'All'], ['Instagram', 'Instagram'], ['YouTube', 'YouTube'], ['TikTok', 'TikTok']]),
      select('source', 'Source', [['all', 'All'], ['Comment', 'Comments'], ['DM', 'DMs'], ['Story reply', 'Story replies']]),
      select('date', 'Date', [['all', 'Any time'], ['today', 'Today'], ['week', 'Last 7 days'], ['month', 'Last 30 days']]),
      h('label', { class: 'check flt-check' }, kwBox, 'Show keyword comments')));
  box.open = window.matchMedia('(min-width: 700px)').matches || filtersOpen;
  box.addEventListener('toggle', () => (filtersOpen = box.open));
  body.append(box);
  const shown = conversations

const STEP_LABEL = { asked: 'asked to reply', linkSent: 'got the link', clicked: 'opened the link', signedUp: 'signed up', reminded: 'reminded' };

// ---- one conversation ----
async function showConversation(body, key) {
  const { conversations } = await api('/api/conversations');
  const c = conversations.find((x) => x.key === key);
  if (!c) { body.append(h('p', { class: 'empty', text: 'This conversation is gone.' })); return; }
  if (c.unread) await api('/api/conversations/read', { method: 'POST', body: { key } }).catch(() => {});
  body.append(
    h('div', { class: 'row between' },
      h('button', { text: '← Inbox', on: { click: () => (location.hash = 'inbox') } }),
      h('button', { class: 'quiet', text: 'Mark as unread', on: { click: async () => { await api('/api/conversations/read', { method: 'POST', body: { key, read: false } }); location.hash = 'inbox'; } } })),
    h('div', { class: 'head' }, h('h2', { text: who(c) }), h('span', { class: 'pill', text: c.platform })));
  // Their messages, your replies and the freebie steps, in time order.
  const events = [];
  for (const r of c.items) {
    events.push({ at: r.receivedAt, row: r });
    if (r.draft && ['Posted', 'Approved'].includes(r.status)) events.push({ at: r.postedAt || r.updatedAt || r.receivedAt, reply: r });
    if (String(r.dm || '').startsWith('sent: ')) events.push({ at: r.receivedAt, auto: r });
  }
  for (const f of c.flows || []) for (const s of f.history || []) events.push({ at: s.at, sys: `${f.keyword}: ${STEP_LABEL[s.step]}${s.step === 'signedUp' && f.email ? ` (${f.email})` : ''}` });
  events.sort((a, b) => String(a.at || '').localeCompare(String(b.at || '')));
  const thread = h('div', { class: 'thread' });
  for (const e of events) {
    if (e.sys) thread.append(h('div', { class: 'sys', text: e.sys }));
    else if (e.auto) thread.append(h('div', { class: 'bubble me' }, h('div', { class: 'meta', text: e.auto.keyword ? `Automatic DM · ${e.auto.keyword}` : 'Automatic welcome DM' }), e.auto.dm.replace(/^sent: /, '')));
    else if (e.reply) thread.append(h('div', { class: 'bubble me' }, h('div', { class: 'meta', text: `You · ${e.reply.kind === 'dm' ? 'DM' : 'reply'} · ${e.reply.status === 'Approved' ? 'sending…' : ago(e.at)}` }), e.reply.draft));
    else if (e.row.kind === 'out') thread.append(h('div', { class: 'bubble me' }, h('div', { class: 'meta', text: `You · DM · ${ago(e.at)}` }), e.row.text || ''));
    else thread.append(h('div', { class: 'bubble them' },
      h('div', { class: 'meta' }, `${kindLabel(e.row)} · ${ago(e.at)} `, e.row.link ? h('a', { href: e.row.link, target: '_blank', rel: 'noopener noreferrer', text: 'Open post' }) : null),
      e.row.text || '(no text)'));
  }
  body.append(thread);
  // Reply box for the newest message that's waiting on her.
  const open = [...c.items].reverse().find((r) => r.kind !== 'out' && WAITING.includes(r.status));
  if (open) body.append(h('div', { style: 'height:12px' }), composer(open, c));
  body.append(h('div', { class: 'row' }, h('button', { class: 'danger', text: 'Delete this conversation', on: { click: async () => {
    if (!confirm(`Delete everything from ${who(c)} for good? Use this when someone asks you to delete their data.`)) return;
    for (const r of c.items) await api(`/api/rows/${r.id}`, { method: 'DELETE' }).catch(() => {});
    toast('Deleted.');
    location.hash = 'inbox';
  } } })));
}

function composer(r, c) {
  const box = h('textarea', { 'aria-label': 'Your reply', placeholder: 'Write your reply' });
  box.value = r.draft || '';
  const set = async (change, msg, back) => {
    try {
      await api(`/api/rows/${r.id}`, { method: 'PATCH', body: change });
      // In a DM thread one reply answers everything before it: close their older waiting DMs too.
      if (r.kind === 'dm' && ['Approved', 'Skip'].includes(change.status)) {
        for (const o of c.items) {
          if (o.id !== r.id && o.kind === 'dm' && WAITING.includes(o.status)) await api(`/api/rows/${o.id}`, { method: 'PATCH', body: { status: 'Skip', read: true, note: 'Answered in the same DM thread.' } }).catch(() => {});
        }
      }
      toast(msg);
      if (back) location.hash = 'inbox'; else route();
    } catch (e) { toast(e.message); }
  };
  const tiktok = r.platform === 'TikTok';
  const label = r.draft ? 'Suggested reply (edit it if you like)' : 'No suggestion yet. Say "draft my comment replies" to Claude, or write your own.';
  const buttons = tiktok
    ? [h('button', { class: 'primary', text: 'Copy & open TikTok', on: { click: async () => {
        try { await navigator.clipboard.writeText(box.value); } catch {}
        if (r.link) window.open(r.link, '_blank', 'noopener');
        toast('Copied. Paste it on TikTok, then tap "Mark as replied".');
      } } }),
      h('button', { text: 'Mark as replied', on: { click: () => set({ draft: box.value, status: 'Posted' }, 'Marked as replied.', true) } })]
    : [h('button', { class: 'primary', text: 'Send', on: { click: () => (box.value.trim() ? set({ draft: box.value, status: 'Approved', postNow: true }, 'Sending now.', true) : toast('Write a reply first.')) } })];
  buttons.push(
    h('button', { text: 'Mark as read', title: 'No reply needed', on: { click: () => set({ status: 'Skip', read: true }, 'Done, no reply.', true) } }),
    h('button', { class: 'quiet', text: 'Save draft', on: { click: () => set({ draft: box.value, status: box.value.trim() ? (tiktok ? 'Reply by hand' : 'New') : 'Needs draft' }, 'Draft saved.') } }));
  return h('div', { class: 'compose' },
    h('div', { class: 'label', text: `${kindLabel(r)}${r.kind === 'dm' ? ' (Instagram only allows replies within 24 hours of their last message)' : ''} · ${label}` }),
    r.note && r.status === 'Error' ? h('p', { class: 'warn', text: r.note }) : null,
    box,
    h('div', { class: 'row' }, emojiButton(box), buttons));
}

// A small emoji picker that puts the emoji where the cursor is. (Phones have an emoji key;

const EMOJIS = '😊 😍 🥰 😂 🤣 😅 🙌 👏 🙏 💪 👍 👋 🤝 ✨ 🔥 💯 ❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🎉 🥳 ✅ 👉 👇 📌 💡 📈 💰 💸 🛍️ 📦 📝 📲 🎥 📸 ⭐ 🌟 🤔 😉 😎 🫶 💕 🌸'.split(' ');
function emojiButton(field) {
  const grid = h('div', { class: 'emoji-grid', role: 'group', 'aria-label': 'Emojis', hidden: true },
    EMOJIS.map((e) => h('button', { type: 'button', class: 'emoji', 'aria-label': `Insert ${e}`, text: e, on: { click: () => {
      const at = field.selectionStart ?? field.value.length;

        thread.push(me(k.ask.text || '(write the first DM above)'), them(k.ask.word || 'READY'));
      }
      thread.push(me(k.delivery === 'email' ? fill(k.linkText, link) : fill(k.dm)));
      if (k.delivery === 'email') {
        thread.push(sys(`They tap the link, type their email (added to ${listWhere()}) and see the freebie right away`));
        if (k.afterSignup?.dm) thread.push(me(fill(k.afterSignup.dm, link)));
        if (k.reminder.on) thread.push(sys(`If they haven't signed up after ${mins(k.reminder.minutes)}`), me(fill(k.reminder.text, link)));
      }
      screen = h('div', { class: 'pv-ig' },
        h('div', { class: 'pv-ig-head' }, avatar('brand'), h('strong', { text: HANDLE() })),
        h('div', { class: 'pv-ig-body' }, thread));
    }
    previews.replaceChildren(
      tabs.length > 1 ? h('div', { class: 'chips', role: 'tablist' }, tabs.map(([id, label]) => h('button', { role: 'tab', 'aria-selected': String(id === previewTab), 'aria-pressed': String(id === previewTab), on: { click: () => { previewTab = id; drawPreviews(); } } }, label))) : null,
      h('div', { class: 'pv-phone' }, screen));
  };
  const deliverySection = h('div');
  const drawDelivery = () => {
    const radio = (val, title, sub) => {
      const r = h('input', { type: 'radio', name: 'delivery', value: val, checked: k.delivery === val });
      r.addEventListener('change', () => { k.delivery = val; drawDelivery(); drawYt(); drawPreviews(); });
      return h('label', {}, r, h('span', {}, h('strong', { text: title }), h('br'), h('span', { class: 'hint', text: sub })));
    };
    const parts = [
      h('div', { class: 'radio' },
        radio('direct', 'Link in the DM', 'The DM carries the freebie link. Quick, but you don\'t get their email.'),
        radio('email', 'Email signup (recommended)', `The DM carries their personal link; they type their email (added to ${listWhere()}) and see the freebie right away.`)),
    ];
    if (k.delivery === 'direct') parts.push(text(k, 'dm', 'DM text', { area: true, hint: '{url} becomes the freebie link.', onInput: drawPreviews }));
    else {
      parts.push(text(k, 'linkText', 'DM text', { area: true, hint: '{link} becomes their personal signup link.', onInput: drawPreviews }));
      parts.push(text(k.signup, 'headline', 'Signup page headline', { placeholder: `Get your free ${String(k.freebie || 'freebie').replace(/^free\s+/i, '')}` }));
      parts.push(text(k.signup, 'text', 'Signup page text', { placeholder: 'Pop in your email and you can open it right away.' }));
      parts.push(text(k.afterSignup, 'dm', 'DM after they sign up (optional)', { area: true, placeholder: `Here's your ${k.freebie || 'freebie'}, as promised: {url}`, hint: '{url} becomes the freebie link. Only reaches people who DMed you (Instagram\'s rule), so it pairs with "Ask first".', onInput: drawPreviews }));
      if (!L.needsTarget) {
        parts.push(h('p', { class: 'hint', style: 'margin-top:12px', text: L.id === 'webhook' ? 'Each signup goes to your webhook and stays in your Email list too.' : 'Signups go to your Email list (tab at the top), ready to download as a CSV.' }));
      } else if (targets.connected) {
        const sel = h('select', { id: 'f-group' }, h('option', { value: '', text: `Choose a ${L.label}…` }), targets.targets.map((t) => h('option', { value: t.id, text: t.name })));
        sel.value = k.list.id || '';
        sel.addEventListener('change', () => { k.list = { id: sel.value, name: sel.value ? sel.selectedOptions[0]?.textContent || '' : '' }; drawGroup(); });
        parts.push(h('label', { for: 'f-group', text: `${L.name} ${L.label}` }), sel, groupPanel);
        drawGroup();
      } else {
        parts.push(h('p', { class: 'warn', text: `Couldn't load your ${L.name} ${L.label}s (${targets.error || 'not connected'}). Ask Claude: "check my ${L.name} connection".` }));
      }
      parts.push(h('h3', { style: 'margin-top:16px', text: 'Reminder' }),
        toggle(k.reminder, 'on', 'Send one reminder if they don\'t sign up', () => { drawDelivery(); drawPreviews(); }));
      if (k.reminder.on) parts.push(
        text(k.reminder, 'minutes', 'After how many minutes', { type: 'number', hint: 'For example 30, or 120 for two hours. Instagram only allows it within 24 hours of their last DM, so 5 to 1380.', onInput: drawPreviews }),
        text(k.reminder, 'text', 'Reminder text', { area: true, hint: '{link} becomes their signup link.', onInput: drawPreviews }),
        k.ask.on ? null : h('p', { class: 'warn', text: 'Reminders only reach people who have DMed you, so turn on "Ask first" too.' }));
    }
    deliverySection.replaceChildren(...parts.flat(3).filter(Boolean));
  };
  const askSection = h('div');
  const drawAsk = () => {
    askSection.replaceChildren(...[
      toggle(k.ask, 'on', 'Ask them to reply first', () => { drawAsk(); drawPreviews(); drawDelivery(); }),
      h('p', { class: 'hint', text: 'Their reply opens a DM conversation, which lets you remind them later. Needs DMs switched on.' }),
      k.ask.on ? [text(k.ask, 'text', 'First DM', { area: true, placeholder: 'Want the free calculator? Reply READY and I\'ll send it over.', onInput: drawPreviews }), text(k.ask, 'word', 'The word they reply', { placeholder: 'READY', onInput: drawPreviews })] : null,
    ].flat(3).filter(Boolean));
  };
  drawAsk();
  drawYt();
  drawDelivery();
  drawPreviews();

  const s = (stats?.keywords || []).find((x) => x.keyword === k.keyword);
  const f = s?.funnel;
  const save = async () => {
    const list = kwCache.filter((x) => x !== orig);
    list.push(k);
    try {
      ({ keywords: kwCache } = await api('/api/keywords', { method: 'PUT', body: { keywords: list } }));
      toast('Saved. Changes work right away.');
      location.hash = `k/${String(k.keyword).toUpperCase()}`;
      if (!isNew && orig.keyword === String(k.keyword).toUpperCase()) route();
    } catch (e) { toast(e.message); }
  };
  body.append(
    h('div', { class: 'row between' }, h('button', { text: '← Keywords', on: { click: () => (location.hash = 'keywords') } })),
    h('div', { class: 'card' },
      h('div', { class: 'section-head' },
        h('h2', { text: isNew ? 'New keyword' : k.keyword }),
        toggle(k, 'live', 'On')),
      isNew ? text(k, 'keyword', 'Keyword (what people comment or DM)', { placeholder: 'MATH', hint: 'One word, letters and numbers.' }) : null,
      h('p', { class: 'hint', text: 'When it\'s on and you\'ve approved the messages below, it works right away.' })),
    h('div', { class: 'card' }, checklist),
    h('div', { class: 'card' }, h('h3', { text: 'Where it works' }),
      check(k.where, 'igComments', 'Instagram comments', () => drawPreviews()),
      check(k.where, 'igDms', 'Instagram DMs and Story replies (needs DMs switched on)', () => drawPreviews()),
      check(k.where, 'ytComments', 'YouTube comments (automatic public reply, since YouTube has no DMs)', () => { drawYt(); drawPreviews(); }),
      ytSection,
      h('p', { class: 'hint', text: 'TikTok doesn\'t allow automated replies, so TikTok keywords land in your inbox to answer by hand.' })),
    h('div', { class: 'card' }, h('h3', { text: 'Freebie' }),
      text(k, 'freebie', 'Name', { placeholder: '$1K Math calculator' }),
      text(k, 'url', 'Link to the freebie', { type: 'url', placeholder: 'https://…', onInput: drawPreviews }),
      h('div', { class: 'row' }, h('button', { text: 'Open freebie', on: { click: () => (k.url ? window.open(k.url, '_blank', 'noopener') : toast('Add the link first.')) } }))),
    h('div', { class: 'card' }, h('h3', { text: 'Step 1: Ask first (optional)' }), askSection),
    h('div', { class: 'card' }, h('h3', { text: `Step ${k.ask.on ? 2 : 1}: How they get it` }), deliverySection),
    h('div', { class: 'card' }, h('h3', { text: 'What they\'ll see' }), previews,
      check(k, 'dmApproved', 'I approve these messages')),
    !isNew ? h('div', { class: 'card' }, h('h3', { text: 'Last 30 days' }),
      s ? h('div', { class: 'funnel' },
        [[s.comments, 'used it'], [f?.asked ?? 0, 'asked to reply'], [f?.linkSent ?? s.dmsSent, 'got the link'], [f?.clicked ?? 0, 'opened it'], [f?.signedUp ?? 0, 'signed up'], [f?.reminded ?? 0, 'reminded']]
          .map(([n, l]) => h('div', {}, h('div', { class: 'big', text: String(n) }), h('div', { class: 'hint', text: l }))))
        : h('p', { class: 'hint', text: 'Nobody has used it yet.' })) : '',
    h('div', { class: 'row between' },
      h('button', { class: 'primary', text: 'Save', on: { click: save } }),
      !isNew ? h('button', { class: 'danger', text: 'Delete keyword', on: { click: async () => {
        if (!confirm(`Delete ${k.keyword}? People who comment it won't get anything.`)) return;
        try { await api(`/api/keywords/${encodeURIComponent(orig.keyword)}`, { method: 'DELETE' }); kwCache = []; toast('Deleted.'); location.hash = 'keywords'; } catch (e) { toast(e.message); }
      } } }) : null));
  // The checklist follows every change on the page.
  body.addEventListener('change', () => drawChecklist());
  body.addEventListener('input', () => drawChecklist());
  drawChecklist();
}

// ---- email list: everyone who signed up for a freebie (kept on this server whatever tool is connected) ----
async function showEmailList(body) {
  const { subscribers, list } = await api('/api/subscribers');
  const stuck = subscribers.filter((x) => ['waiting', 'failed'].includes(x.status));
  const tool = list.id === 'builtin' ? null : list.name;
  body.append(h('div', { class: 'card' },
    h('h3', { text: `${subscribers.length} ${subscribers.length === 1 ? 'person' : 'people'} on your list` }),
    h('p', { class: 'hint', text: tool
      ? `New signups go to ${tool} and are kept here too.`
      : 'Your list lives here on your server. Download it any time and import it into an email tool (MailerLite, Kit, Mailchimp and others all take a CSV).' }),
    h('div', { class: 'row' },
      h('a', { class: 'button', href: '/inbox/api/subscribers.csv', download: '', text: 'Download CSV' }),
      list.id === 'builtin' ? null : h('button', { text: 'Send a test signup', on: { click: async () => {
        const email = prompt(`Your email, to send one test signup to ${tool}`);
        if (!email) return;
        const listId = list.needsTarget ? prompt(`Which ${list.label}? Paste its ID (open a keyword to see the names)`, kwCache.find((k) => k.list?.id)?.list.id || '') : '';
        try { await api('/api/lists/test', { method: 'POST', body: { email, listId } }); toast(`Sent. Check ${tool}.`); } catch (e) { toast(e.message); }
      } } }))));
  if (stuck.length) body.append(h('div', { class: 'card' },
    h('h3', { text: `${stuck.length} signup${stuck.length === 1 ? '' : 's'} didn't reach ${tool || 'your email tool'} yet` }),
    h('p', { class: 'hint', text: `They got their freebie and are safe here. Last reason: ${stuck[0].error || 'unknown'}. It tries again every 15 minutes.` }),
    h('div', { class: 'row' }, h('button', { class: 'primary', text: 'Try again now', on: { click: async () => {
      try { const r = await api('/api/subscribers/retry', { method: 'POST' }); toast(r.waiting ? `${r.waiting} still waiting.` : 'All sent.'); route(); } catch (e) { toast(e.message); }
    } } }))));
  if (!subscribers.length) return body.append(h('div', { class: 'list' }, h('p', { class: 'empty', text: 'Nobody yet. Signups from your keywords show up here.' })));
  const label = { kept: 'Kept here', sent: `In ${tool || 'your tool'}`, waiting: 'Waiting to send', failed: "Didn't send", new: 'New' };
  body.append(h('div', { class: 'card' }, h('table', {},
    h('thead', {}, h('tr', {}, h('th', { text: 'Email' }), h('th', { class: 'sr-only', text: 'Delete' }))),
    h('tbody', {}, subscribers.map((x) => h('tr', {},
      h('td', { style: 'overflow-wrap:anywhere' }, x.email, h('div', { class: 'hint', text: `${x.keyword} · ${ago(x.at)} · ${label[x.status] || x.status}` })),
      h('td', {}, h('button', { class: 'danger', text: 'Delete', 'aria-label': `Delete ${x.email}`, on: { click: async () => {
        if (!confirm(`Delete ${x.email} from this list? (For a deletion request, also remove them in ${tool || 'any tool you imported the list into'}.)`)) return;
        try { await api(`/api/subscribers/${x.id}`, { method: 'DELETE' }); toast('Deleted.'); route(); } catch (e) { toast(e.message); }
      } } }))))))));
}

// ---- stats ----
let statDays = 30;
async function showStats(body) {
  const s = await api(`/api/stats?days=${statDays}`).catch(() => null);
  if (!s) return body.append(h('p', { class: 'empty', text: 'No stats yet.' }));
  const period = h('select', { id: 'st-days', 'aria-label': 'Period' }, [[7, 'Last 7 days'], [30, 'Last 30 days'], [90, 'Last 90 days']].map(([v, t]) => h('option', { value: v, text: t })));
  period.value = String(statDays);
  period.addEventListener('change', () => { statDays = Number(period.value); route(); });
  const tile = (n, label) => h('div', {}, h('div', { class: 'big', text: String(n) }), h('div', { class: 'hint', text: label }));
  const t = s.totals;
  body.append(
    h('div', { class: 'filters' }, h('div', { class: 'flt' }, h('label', { for: 'st-days', text: 'Period' }), period)),
    h('div', { class: 'card' }, h('div', { class: 'funnel' },
      tile(t.contacts, 'contacts (all time)'),
      tile(t.newContacts, 'new contacts'),
      tile(t.keywordUses, 'keyword uses'),
      tile(t.dmsSent, 'freebie DMs / replies'),
      tile(t.signups, 'email signups'),
      tile(t.conversion == null ? '-' : `${t.conversion}%`, 'got the link → signed up'))));
  // Daily bar charts. Each bar's label is read out for screen readers.
  const chart = (key, title) => {
    const max = Math.max(1, ...s.series.map((d) => d[key]));
    const total = s.series.reduce((a, d) => a + d[key], 0);
    return h('div', { class: 'card' },
      h('h3', { text: `${title}: ${total}` }),
      h('div', { class: 'chart', role: 'img', 'aria-label': `${title} per day, ${total} in total` },
        s.series.map((d) => h('span', { title: `${d.date}: ${d[key]}`, style: `height:${Math.round((d[key] / max) * 100)}%` }))),
      h('div', { class: 'chart-axis' }, h('span', { text: s.series[0]?.date.slice(5) || '' }), h('span', { text: s.series[s.series.length - 1]?.date.slice(5) || '' })));
  };
  body.append(chart('newContacts', 'New contacts'), chart('signups', 'Email signups'), chart('keywordUses', 'Keyword uses'));
  if (!s.keywords.length) return body.append(h('p', { class: 'empty', text: 'No keyword activity in this period.' }));
  body.append(h('div', { class: 'card' }, h('h3', { text: 'Per keyword' }), h('table', {},
    h('thead', {}, h('tr', {}, h('th', { text: 'Keyword' }), h('th', { class: 'n', text: 'Used' }), h('th', { class: 'n', text: 'Got link' }), h('th', { class: 'n', text: 'Signed up' }), h('th', { class: 'n', text: 'Conversion' }), h('th', { text: 'Top post' }))),
    h('tbody', {}, s.keywords.map((k) => {
      const top = Object.entries(k.posts).sort((a, b) => b[1] - a[1])[0];
      const got = k.funnel?.linkSent ?? k.dmsSent;
      const conv = k.funnel && got ? `${Math.round((k.funnel.signedUp / got) * 100)}%` : '-';
      return h('tr', {},
        h('td', {}, h('a', { href: `#k/${k.keyword}`, text: k.keyword })),
        h('td', { class: 'n', text: String(k.comments) }),
        h('td', { class: 'n', text: String(got) }),
        h('td', { class: 'n', text: String(k.funnel?.signedUp ?? '-') }),
        h('td', { class: 'n', text: conv }),
        h('td', {}, top ? h('a', { href: top[0], target: '_blank', rel: 'noopener noreferrer', text: `${top[1]} on this post` }) : ''));
    })))));
}

route();
</script>
