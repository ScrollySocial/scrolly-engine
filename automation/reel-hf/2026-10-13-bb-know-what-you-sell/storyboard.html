<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your AI should know what you’re selling storyboard v1</title>
<style>
@font-face{font-family:'ScrollyFigtree';src:url('assets/fonts/figtree.woff2') format('woff2');font-weight:300 900}
@font-face{font-family:'ScrollyBricolage';src:url('assets/fonts/bricolage-800.woff2') format('woff2');font-weight:800;font-stretch:75% 100%}
@font-face{font-family:'ScrollyHand';src:url('assets/fonts/covered-by-your-grace.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F6EEE5;color:#161210;font:15px/1.4 'ScrollyFigtree',sans-serif;padding:24px 16px}
h1{font:800 26px 'ScrollyBricolage';font-stretch:78%;margin-bottom:4px}.sub{margin-bottom:20px;color:#5c534d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 16px}
.frame{position:relative;width:100%;aspect-ratio:9/16;overflow:hidden;container-type:inline-size;border-radius:10px;background:#000;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.frame .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene{position:absolute;inset:0}
.abs{position:absolute}.blk{display:block}.fill,.fade{position:absolute;inset:0}
.big{position:absolute;left:5cqw;right:5cqw;text-align:center;font-family:'ScrollyBricolage';font-weight:800;font-stretch:78%;line-height:.9;letter-spacing:-.01em;text-shadow:0 .4cqw 2cqw rgba(0,0,0,.35)}
.big .w{display:inline-block}
.mk{position:relative;display:inline-block;padding:0 .12em}
.mkbg{position:absolute;left:-.04em;right:-.04em;top:.1em;bottom:.02em;background:#FFC9A8;transform-origin:0 50%;border-radius:.08em;display:block}
.mk{rotate:-1.5deg}.mkbg{skew:-6deg}
.mkt{position:relative;color:#161210;text-shadow:none}
.hand{position:absolute;font-family:'ScrollyHand';line-height:1;text-shadow:0 0 1.1cqw rgba(0,0,0,.6),0 .3cqw 1.6cqw rgba(0,0,0,.55);white-space:nowrap}
.cap{position:absolute;left:6cqw;right:6cqw;text-align:center;z-index:8}
.cap span{display:inline-block;font:800 5.4cqw/1.15 'ScrollyFigtree';color:#fff;text-shadow:0 0 .6cqw rgba(0,0,0,.8),0 .5cqw 1.8cqw rgba(0,0,0,.6)}
.chat{position:absolute;left:6cqw;right:6cqw;display:flex;flex-direction:column;gap:1.6cqw}
.msg{font:500 4cqw/1.3 'Segoe UI','ScrollyFigtree',sans-serif;padding:2.4cqw 3.2cqw;border-radius:4.4cqw;max-width:84%;box-shadow:0 .8cqw 2.4cqw rgba(0,0,0,.25)}
.msg.me{align-self:flex-end;background:#2f2f2f;color:#fff;border-bottom-right-radius:1.2cqw}
.msg.ai{align-self:flex-start;background:#fff;color:#1c1c1c;border-bottom-left-radius:1.2cqw}
.chip{align-self:flex-end;font:600 3.2cqw 'Segoe UI','ScrollyFigtree';background:#fff;color:#333;padding:1.2cqw 2.4cqw;border-radius:2cqw;border:.3cqw solid #ddd}
.paper{position:absolute;left:14cqw;right:14cqw;background:#fffdf7;background-image:repeating-linear-gradient(180deg,transparent 0 8.4cqw,#cfe0ee 8.4cqw 8.7cqw);padding:2.6cqw 5cqw 3cqw;font:400 7.6cqw/8.7cqw 'ScrollyHand';color:#2b2724;box-shadow:0 1.4cqw 3.6cqw rgba(0,0,0,.35)}
.paper div{display:flex;justify-content:space-between}.tick{display:inline-block;color:#2e7d4f;font-family:'ScrollyFigtree';font-weight:800}.tick.x{color:#E05A33}
.badge{position:absolute;width:46cqw;border-radius:2.4cqw;overflow:hidden;box-shadow:0 1.4cqw 3.6cqw rgba(0,0,0,.4);background:#fff}
.b-top{background:#E05A33;color:#fff;text-align:center;font:800 9cqw/1 'ScrollyFigtree';padding:2cqw 0 1.4cqw}.b-top small{display:block;font:600 3.4cqw 'ScrollyFigtree';margin-top:.6cqw}
.b-name{font:400 7.4cqw/1 'ScrollyHand';color:#161210;text-align:center;padding:4cqw 2cqw 4.6cqw}
.folder{position:absolute;width:30cqw;filter:drop-shadow(0 1.4cqw 2.4cqw rgba(0,0,0,.4))}
.f-tab{display:inline-block;background:#E9C98E;font:400 6.4cqw/1 'ScrollyHand';color:#2b2724;padding:1.6cqw 3cqw 1cqw 2.4cqw;border-radius:1.6cqw 3cqw 0 0;white-space:nowrap}
.f-body{height:20cqw;border-radius:0 1.6cqw 1.6cqw 1.6cqw;position:relative;overflow:hidden;background:linear-gradient(180deg,#F2D7A3,#E2BE80)}
.f-body i{position:absolute;left:12%;right:12%;display:block}.f-body i:nth-child(1){top:-.6cqw;height:4cqw;background:#fffdf7;border-radius:.4cqw}.f-body i:nth-child(2){top:7cqw;height:.5cqw;background:rgba(138,106,58,.35)}.f-body i:nth-child(3){top:10cqw;height:.5cqw;right:30%;background:rgba(138,106,58,.35)}
.post{position:absolute;width:27cqw;border-radius:1cqw;border:.8cqw solid #fff;box-shadow:0 1.4cqw 3cqw rgba(0,0,0,.4)}
.receipt{position:absolute;width:30cqw;background:#fffdf7;padding:3cqw 3.2cqw 6cqw;font:400 5.4cqw/1.12 'ScrollyHand';color:#2b2724;rotate:-3deg;box-shadow:0 1.4cqw 3cqw rgba(0,0,0,.35)}
.receipt b{font-weight:400;color:#E05A33}
.prompt{position:absolute;width:56cqw;display:flex;align-items:center;justify-content:space-between;background:#2f2f2f;color:#fff;border-radius:99px;padding:2.4cqw 2.4cqw 2.4cqw 4cqw;font:500 4.4cqw 'Segoe UI','ScrollyFigtree';box-shadow:0 1cqw 3cqw rgba(0,0,0,.4)}
.prompt .ptxt{display:inline-block}
.prompt i{font-style:normal;width:6.4cqw;height:6.4cqw;border-radius:50%;background:#fff;color:#2f2f2f;display:grid;place-items:center;font-weight:800}
.md{position:absolute;left:5cqw;right:5cqw;background:#1f1d1b;border-radius:2cqw;overflow:hidden;box-shadow:0 1.6cqw 4cqw rgba(0,0,0,.45);font:500 3.7cqw/1.55 Consolas,'Cascadia Mono',monospace}
.md-bar{display:flex;align-items:center;gap:1.2cqw;padding:1.6cqw 2.4cqw;background:#2b2826}.md-bar i{width:2cqw;height:2cqw;border-radius:50%;background:#5a5450;display:block}.md-bar span{margin-left:1.6cqw;font:600 3.2cqw 'ScrollyFigtree';color:#cfc6bd}
.md-body{padding:1.8cqw 0 2.4cqw}.ln{display:flex;gap:3cqw;padding:0 3cqw;color:#e9e1d8;min-height:5.7cqw}.ln b{width:4cqw;text-align:right;color:#6f6862;font-weight:400}.lt{display:inline-block}
.ln.h .lt{color:#FFC9A8;font-weight:700}.ln.add{background:rgba(110,190,130,.16)}.ln.add b{color:#7fcf93}.ln.no{background:rgba(224,90,51,.16)}.ln.no b{color:#E05A33}
.brainwrap{position:absolute;inset:0;overflow:hidden;background:#efe6da}.brain{position:absolute;left:0;top:0;width:100%;display:block}
.url{position:absolute;left:14cqw;right:14cqw;display:flex;align-items:center;gap:2cqw;background:#fff;border-radius:99px;padding:2.4cqw 4cqw;font:600 5cqw 'Segoe UI','ScrollyFigtree';color:#1c1c1c;box-shadow:0 1cqw 3cqw rgba(0,0,0,.35)}.lock{font-size:3.6cqw}
.ph{position:relative;display:inline-block;font-weight:700;color:#8a3b22;background:#fbe9df;border-radius:1cqw;padding:0 .8cqw;margin:1.3cqw .6cqw}
.ph-ring{position:absolute;left:-12%;top:-38%;width:124%;height:176%;overflow:visible;pointer-events:none}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.draw{stroke-dashoffset:0}

figcaption{margin-top:8px;font-size:15px}figcaption .t{color:#7a6f68}figcaption i{color:#4a423d}.snd{color:#E05A33}
</style></head><body><h1>Your AI should know what you’re selling</h1><p class="sub">Storyboard v1: real stills from the take, graphics drawn with the Reel's own components (final positions). Captions shown are the relaxed lower-third ones.</p><div class="grid">
<figure class="cell"><div class="frame" id="f1"><img class="bg" src="sketch/f01.jpg"><div class="scene"><div class="fade" style="background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.25) 27.599999999999998%,rgba(0,0,0,0) 46%)"></div><div id="b1" class="big" style="top:6cqw;font-size:11cqw;color:#fff"><span class="w">Your</span> <span class="w">AI</span> <span class="w">should</span> <span class="w">know</span> <span class="w">what</span> <span class="w">you’re</span> <span class="w"><span class="mk"><span class="mkbg"></span><span class="mkt">selling</span></span></span> </div></div><div class="scene"></div><div class="cap" style="top:128cqw"><span>Your AI should know what</span></div></div>
<figcaption><b>F1</b> <span class="t">0.0–3.4s</span> Hook above her head<br><i>“Your AI should know what you're selling. Imagine”</i><br><span class="snd">♪ pop on the swipe</span></figcaption></figure>
<figure class="cell"><div class="frame" id="f2"><img class="bg" src="sketch/f02.jpg"><div class="scene"><div class="fade" style="background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.25) 30%,rgba(0,0,0,0) 50%)"></div><div class="chat" style="top:6cqw"><div id="c2a" class="msg ai">Hi! What can I help you with today?</div><div id="c2b" class="msg me">write an Instagram post for my sourdough starter kit</div></div></div><div class="scene"></div><div class="cap" style="top:128cqw"><span>that you're using AI to</span></div></div>
<figcaption><b>F2</b> <span class="t">3.4–10.8s</span> A chat opens; she asks for a post<br><i>“that you're using AI to help market your business. You ask it to write an Instagram post for one of your products.”</i><br><span class="snd">♪ pop on the greeting, typing under the ask</span></figcaption></figure>
<figure class="cell"><div class="frame" id="f3"><img class="bg" src="sketch/f03.jpg"><div class="scene"><div class="fade" style="background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.25) 32.4%,rgba(0,0,0,0) 54%)"></div><div class="chat" style="top:4cqw"><div id="c3a" class="msg me">write an Instagram post for my sourdough starter kit</div><div id="c3b" class="msg ai">Meet our Sourdough Starter Kit!<br>Only <span id="ph1" class="ph">[PRICE]<svg class="ph-ring" viewBox="0 0 200 100" preserveAspectRatio="none"><path class="draw" pathLength="1" d="M18 52 C14 18 70 6 112 8 C170 11 196 34 190 58 C184 86 120 96 76 92 C34 88 6 70 22 40" fill="none" stroke="#E05A33" stroke-width="5" stroke-linecap="round"/></svg></span><br>Comes with <span id="ph2" class="ph">[WHAT’S INCLUDED]<svg class="ph-ring" viewBox="0 0 200 100" preserveAspectRatio="none"><path class="draw" pathLength="1" d="M18 52 C14 18 70 6 112 8 C170 11 196 34 190 58 C184 86 120 96 76 92 C34 88 6 70 22 40" fill="none" stroke="#E05A33" stroke-width="5" stroke-linecap="round"/></svg></span><br>Perfect for <span id="ph3" class="ph">[AUDIENCE]<svg class="ph-ring" viewBox="0 0 200 100" preserveAspectRatio="none"><path class="draw" pathLength="1" d="M18 52 C14 18 70 6 112 8 C170 11 196 34 190 58 C184 86 120 96 76 92 C34 88 6 70 22 40" fill="none" stroke="#E05A33" stroke-width="5" stroke-linecap="round"/></svg></span> ✨</div></div></div><div class="scene"></div><div class="cap" style="top:128cqw"><span>Well</span></div></div>
<figcaption><b>F3</b> <span class="t">10.8–16.7s</span> AI reply full of blanks; each blank circled as she says it<br><i>“Well, does it know how much it costs or what's included? Does it know who you're actually trying to sell it to? Because otherwise”</i><br><span class="snd">♪ pop on the reply; circles draw silently, one nope on the last</span></figcaption></figure>
<figure class="cell"><div class="frame" id="f4"><img class="bg" src="sketch/f04.jpg"><div class="scene"><div class="fade" style="background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.25) 28.799999999999997%,rgba(0,0,0,0) 48%)"></div><div class="chat" style="top:6cqw"><div id="c4a" class="msg me">it’s $24</div><div id="c4b" class="msg me">it comes with a jar too</div><div id="c4c" class="msg me">it’s for first-time bakers</div></div><div id="h4" class="hand" style="left:5cqw;top:41cqw;font-size:6.5cqw;rotate:-3deg;color:#FFF4DC">faster to just write it myself</div></div><div class="scene"></div><div class="cap" style="top:128cqw"><span>you can end up spending</span></div></div>
<figcaption><b>F4</b> <span class="t">16.7–24.3s</span> Her corrections stack up; handwritten aside<br><i>“you can end up spending more money and time correcting your AI than you would have spent just writing post yourself.”</i><br><span class="snd">♪ pop, bubble pop, pop</span></figcaption></figure>
<figure class="cell"><div class="frame" id="f5"><img class="bg" src="sketch/f05.jpg"><div class="scene"><div class="fill" style="background:#E7EEF5"></div><div id="b5" class="big" style="top:7cqw;font-size:13.5cqw;color:#161210"><span class="w">One</span> <span class="w"><span class="mk"><span class="mkbg"></span><span class="mkt">central place</span></span></span> <span class="w">for</span> <span class="w">my</span> <span class="w">business</span> <span class="w">info</span></div></div><img class="bg" src="sketch/f05-cut.png"><div class="scene"></div></div>
<figcaption><b>F5</b> <span class="t">24.3–30.8s</span> Background swap (her cut out on mist), held: nothing else moves<br><i>“One of the things that I've done is I've created a central place for all of my business information. It”</i><br><span class="snd">♪ whip whoosh in, air whoosh on the words</span></figcaption></figure>
<figure class="cell"><div class="frame" id="f6"><img class="bg" src="sketch/f06.jpg"><div class="scene"><div class="fade" style="background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.25) 28.799999999999997%,rgba(0,0,0,0) 48%)"></div><div id="f6a" class="folder" style="left:1cqw;top:11cqw;rotate:-8deg"><div class="f-tab">offers</div><div class="f-body"><i></i><i></i><i></i></div></div><div id="f6b" class="folder" style="left:23cqw;top:4cqw;rotate:-2deg"><div class="f-tab">prices</div><div class="f-body"><i></i><i></i><i></i></div></div><div id="f6c" class="folder" style="left:45cqw;top:8cqw;rotate:3deg"><div class="f-tab">customers</div><div class="f-body"><i></i><i></i><i></i></div></div><div id="f6d" class="folder" style="left:69cqw;top:19cqw;rotate:8deg"><div class="f-tab">working on</div><div class="f-body"><i></i><i></i><i></i></div></div><div id="h6" class="hand" style="left:8cqw;top:42cqw;font-size:7cqw;rotate:-3deg;color:#FFF4DC">a place to live</div></div><div class="scene"></div><div class="cap" style="top:128cqw"><span>has my offers</span></div></div>
<figcaption><b>F6</b> <span class="t">30.8–39.0s</span> Folders fan in, one per word<br><i>“has my offers, my prices, my customers, things I'm currently working on. It all has a place to live.”</i><br><span class="snd">♪ paper slide, bubble pop, paper slide, pop (never the same twice in a row)</span></figcaption></figure>
<figure class="cell"><div class="frame" id="f7"><img class="bg" src="sketch/f07.jpg"><div class="scene"><div class="fade" style="background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.25) 32.4%,rgba(0,0,0,0) 54%)"></div><div class="chat" style="top:4cqw"><div id="c7a" class="msg me">write an Instagram post for my sourdough starter kit</div><div id="c7b" class="chip">🧠 My offers</div><div id="c7c" class="msg ai">Sourdough Starter Kit, $24: live starter, glass jar and feeding guide. Made for first-time bakers.</div></div><div id="h7" class="hand" style="left:54cqw;top:51cqw;font-size:8cqw;rotate:-5deg;color:#FFC9A8">no guessing</div><div id="a7" class="abs blk" style="left:33cqw;top:48.5cqw;width:18cqw;height:13.5cqw;rotate:200deg"><svg viewBox="0 0 120 90" style="width:100%;height:100%"><path class="draw" pathLength="1" d="M8 12 C40 4 86 18 98 64" fill="none" stroke="#FFC9A8" stroke-width="6" stroke-linecap="round"/><path class="draw" pathLength="1" d="M80 52 L99 70 L110 46" fill="none" stroke="#FFC9A8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div><div class="scene"></div><div class="cap" style="top:128cqw"><span>And then when I want</span></div></div>
<figcaption><b>F7</b> <span class="t">39.0–46.0s</span> Same ask, with My offers attached: AI gets it right<br><i>“And then when I want AI to help me with something, it can reference that information instead of guessing.”</i><br><span class="snd">♪ bubble pop, pop on the file, bubble pop, check on the aside</span></figcaption></figure>
<figure class="cell"><div class="frame" id="f8"><img class="bg" src="sketch/f08.jpg"><div class="scene"><div class="fade" style="background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.25) 30%,rgba(0,0,0,0) 50%)"></div><div id="p8" class="paper" style="top:6cqw"><div>price <span id="t8a" class="tick">✓</span></div><div>what’s included <span id="t8b" class="tick">✓</span></div><div>who it’s for <span id="t8c" class="tick">✓</span></div></div><div id="h8" class="hand" style="left:46cqw;top:40cqw;font-size:7.5cqw;rotate:-4deg;color:#FFF4DC">so much easier</div></div><div class="scene"></div><div class="cap" style="top:128cqw"><span>Of course</span></div></div>
<figcaption><b>F8</b> <span class="t">46.0–53.6s</span> Lined-paper check: each line ticks as she talks<br><i>“Of course, you still need to check your output, but having the right information available to your AI makes that process so much easier.”</i><br><span class="snd">♪ paper slide, check, pop, check</span></figcaption></figure>
<figure class="cell"><div class="frame" id="f9"><img class="bg" src="sketch/f09.jpg"><div class="scene"><div class="brainwrap"><img id="br9" class="brain" src="assets/img/brain.png" data-layout-allow-overflow></div><div class="fill" style="background:rgba(22,18,16,0.12)"></div></div><img class="bg" src="sketch/f09-cut.png"><div class="scene"><svg id="cur9" class="abs blk" style="left:74cqw;top:14cqw;width:7cqw;height:7cqw" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15 L13 23 L16 21.5 L12 14 L19 14 Z" fill="#fff" stroke="#161210" stroke-width="1.5"/></svg></div><div class="cap" style="top:128cqw"><span>I created the Scrolly Business</span></div></div>
<figcaption><b>F9</b> <span class="t">53.6–56.7s</span> The real Business Brain scrolls behind her (cut out); cursor clicks<br><i>“I created the Scrolly Business Brain to help other business owners”</i><br><span class="snd">♪ whip whoosh in, pop on the click</span></figcaption></figure>
<figure class="cell"><div class="frame" id="f10"><img class="bg" src="sketch/f10.jpg"><div class="scene"><div class="fade" style="background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.25) 30%,rgba(0,0,0,0) 50%)"></div><div id="b10" class="big" style="top:6cqw;font-size:11cqw;color:#fff"><span class="w">Scrolly</span> <span class="w"><span class="mk"><span class="mkbg"></span><span class="mkt">Business Brain</span></span></span> </div><div id="u10" class="url" style="top:31cqw"><span class="lock">🔒</span>scrollyseo.com</div><div id="h10" class="hand" style="left:56cqw;top:44cqw;font-size:7.5cqw;rotate:-4deg;color:#FFF4DC">on my website</div><div id="a10" class="abs blk" style="left:34cqw;top:41cqw;width:18cqw;height:13.5cqw;rotate:190deg"><svg viewBox="0 0 120 90" style="width:100%;height:100%"><path class="draw" pathLength="1" d="M8 12 C40 4 86 18 98 64" fill="none" stroke="#FFF4DC" stroke-width="6" stroke-linecap="round"/><path class="draw" pathLength="1" d="M80 52 L99 70 L110 46" fill="none" stroke="#FFF4DC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div><div class="scene"></div></div>
<figcaption><b>F10</b> <span class="t">56.7–61.2s</span> End card: name + scrollyseo.com, she keeps talking<br><i>“set up this same kind of system. You can check it out on my website.”</i><br><span class="snd">♪ air whoosh, chime under “on my website”</span></figcaption></figure>
</div></body></html>
