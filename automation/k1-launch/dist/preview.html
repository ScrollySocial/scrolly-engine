<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My $1K Plan Preview</title>
<style>body{margin:0;background:#f7f3ec}main{max-width:820px;margin:0 auto;padding:16px}@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Jost:wght@400;500;700;800&display=swap');
/* Scrolly v3 FOUNDATION (2026-10-03). One source for the v3 look on every page. Printed site-wide ahead of chrome.css by the same
   WPCode snippet (install-chrome.mjs concatenates the two), so it also reaches theme-rendered pages (/product/*, /shop/, 404, opt-out)
   that no page build can touch. Values match the homepage (home.css, .hp).
   Three layers:
   1. tokens on :root (--s3-*)
   2. .s3 components, used by pages rebuilt on v3 (pages/*.mjs render <div class="s3">)
   3. theme layer: styles the plain theme/WooCommerce output on pages that carry none of our roots (.hp homepage, .scx old system, .s3).
      Pages still on the old system keep their own look until they are rebuilt. */

/* 1. tokens. Rebrand 2026-10-19 (vault brand/visual-system.md): off-white page, ink navy text + dark bands, sky-blue buttons with navy text,
   blue-mist cards and soft panels, sky-blue marker under italic words. Hot pink means Mercedes: only where the page is about her or in her
   voice (footer "Tiger.", her name, About, her quotes, frames around her photos, footer stars); never on products, prices, Clubs, tools or
   buttons, and never as text on light. "Less girly" tone, 2026-10-20: no baby pink, no lavender. Instrument Serif for headlines, big numbers and prices (2026-10-20, replaced Georgia; it is narrow, so tracking is -.01em,
   never tighter), Jost for everything else. Both are imported at the top of this file. Contrast pairs: chrome/contrast.mjs.
   --s3-orange / --s3-or-text / --s3-black are the old names, kept as aliases so live page CSS that still uses them follows the new palette. */
:root{--s3-cream:#f7f3ec;--s3-ink:#0a1930;--s3-navy:#0a1930;--s3-muted:#4a4e66;--s3-line:#d9d3ca;--s3-sky:#4da3ff;--s3-pink:#ff3b7f;--s3-mist:#dfe4f0;--s3-mist-ink:#c9d1e6;
  --s3-orange:var(--s3-sky);--s3-or-text:var(--s3-ink);--s3-black:var(--s3-navy);
  --s3-mark:linear-gradient(transparent 60%,var(--s3-sky) 60%,var(--s3-sky) 90%,transparent 90%);
  --s3-serif:"Instrument Serif",Georgia,"Times New Roman",serif;--s3-sans:"Jost",Arial,Helvetica,sans-serif;--s3-gut:clamp(20px,4.5vw,96px);--s3-read:720px;--s3-sec:clamp(56px,6vw,112px);
  /* type scale (2026-10-03, Mercedes: no random sizes). Every text size on v3 pages is one of these steps; nothing under 15px. */
  --s3-fs-h2:clamp(2.4rem,4vw,4rem);--s3-fs-h3:clamp(1.9rem,2.6vw,2.5rem);--s3-fs-title:1.75rem;--s3-fs-lede:1.375rem;
  --s3-fs-body:1.125rem;--s3-fs-body-serif:1.25rem;--s3-fs-ui:1.125rem;--s3-fs-num:1.5rem;--s3-fs-label:.9375rem;--s3-fs-fine:1.0625rem}

/* 2. components (.s3 page root) */
body:has(.s3) #content,body:has(.s3) main,body:has(.s3) .site-main,body:has(.s3) .page-content{max-width:none!important;width:100%!important;padding:0!important;margin:0!important}
body:has(.s3) .page-header{display:none}
body:has(.s3){background:var(--s3-cream)!important}
.s3{background:var(--s3-cream);color:var(--s3-ink);font:var(--s3-fs-body)/1.55 var(--s3-sans);overflow-x:clip}
.s3 *,.s3 *::before,.s3 *::after{box-sizing:border-box}
.s3 img{display:block;max-width:100%;height:auto}
.s3 a{color:inherit}
.s3 h1,.s3 h2,.s3 h3,.s3 h4,.s3 p,.s3 figure,.s3 blockquote{margin:0}
.s3 h1,.s3 h2,.s3 h3,.s3 h4{font-family:var(--s3-serif)!important;font-weight:400!important;color:var(--s3-ink);text-transform:none;letter-spacing:-.01em}
/* zero-specificity reset, so .s3-btn and other component classes always win on <button>/<input> */
:where(.s3) :where(button,input,select,textarea){font:inherit}
.s3 a:focus-visible,.s3 button:focus-visible,.s3 input:focus-visible,.s3 select:focus-visible,.s3 textarea:focus-visible,.s3 summary:focus-visible{outline:3px solid var(--s3-navy);outline-offset:4px}
.s3 .s3-dark :focus-visible{outline-color:#fff}
.s3 .s3-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* layout */
.s3-wrap{width:calc(100% - 2 * var(--s3-gut));margin:0 auto}
.s3-read{width:min(calc(100% - 2 * var(--s3-gut)),var(--s3-read));margin:0 auto}
.s3-sec{padding:var(--s3-sec) 0}
.s3-sec.tight{padding:calc(var(--s3-sec) * .55) 0}
.s3-split{display:grid;grid-template-columns:.9fr 1.1fr;align-items:center;gap:clamp(32px,5vw,96px)}
.s3-split.flip{grid-template-columns:1.1fr .9fr}
.s3-split.flip>:first-child{order:2}
.s3-dark{background:var(--s3-navy);color:#fff}
.s3-dark h1,.s3-dark h2,.s3-dark h3{color:#fff}
/* type */
.s3-display{font:400 clamp(3.2rem,7vw,7.8rem)/.88 var(--s3-serif)!important;letter-spacing:-.01em!important}
.s3-h2{font:400 var(--s3-fs-h2)/1.02 var(--s3-serif)!important;letter-spacing:-.01em!important}
.s3-h3{font:400 var(--s3-fs-h3)/1.08 var(--s3-serif)!important}
.s3-num{font:400 clamp(3.6rem,6vw,5.5rem)/.85 var(--s3-serif)!important;color:var(--s3-ink)}
.s3-dark .s3-num{color:var(--s3-sky)}
/* the italic word that carries a headline: navy on a sky-blue marker stroke on light grounds, sky-blue text on navy (6.7:1) */
.s3 .or{color:var(--s3-ink);background:var(--s3-mark);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .08em}
.s3-dark .or{color:var(--s3-sky);background:none;padding:0}
.s3-lede{font:var(--s3-fs-lede)/1.45 var(--s3-sans);max-width:34em}
.s3-label{font:700 var(--s3-fs-label)/1.3 var(--s3-sans);letter-spacing:.18em;text-transform:uppercase}
.s3-fine{font-size:var(--s3-fs-fine);color:var(--s3-muted)}
.s3-dark .s3-fine{color:var(--s3-mist-ink)}
.s3 .stack>*+*{margin-top:24px}
/* controls */
.s3-btn,.s3 .contact-form button[type=submit]{display:inline-flex;align-items:center;justify-content:center;gap:16px;min-height:56px;padding:17px 32px;border:0;border-radius:999px;background:var(--s3-sky);color:var(--s3-navy)!important;font:800 var(--s3-fs-label)/1 var(--s3-sans);letter-spacing:.13em;text-transform:uppercase;text-decoration:none!important;cursor:pointer;transition:background .2s,color .2s}
.s3-btn:hover,.s3 .contact-form button[type=submit]:hover{background:var(--s3-navy);color:#fff!important}
.s3-btn.black{background:var(--s3-navy);color:#fff!important}
.s3-btn.black:hover{background:var(--s3-sky);color:var(--s3-navy)!important}
.s3-dark .s3-btn:hover{background:#fff;color:var(--s3-navy)!important}
.s3-btn.plain{letter-spacing:0;text-transform:none;font-size:var(--s3-fs-ui)}
.s3-btn[disabled],.s3-btn[aria-disabled=true]{background:var(--s3-line);color:#3d3a36!important;cursor:not-allowed}
.s3-link{display:inline-flex;align-items:center;gap:12px;min-height:44px;font:800 var(--s3-fs-label)/1 var(--s3-sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
/* Hello Biz underlines .page-content a (0,1,1); beat it, and keep any hover underline off the arrow (inline-block stops decoration propagation) */
.s3 a.s3-link{text-decoration:none}
.s3 a.s3-link:hover{text-decoration:underline;text-underline-offset:6px}
.s3-link span[aria-hidden]{display:inline-block}
.s3-link span[aria-hidden]{font-size:1.3em;letter-spacing:0}
.s3-field{display:block}
.s3-field label{display:block;margin-bottom:8px;font:700 var(--s3-fs-ui)/1.3 var(--s3-sans);letter-spacing:.06em;color:var(--s3-ink)}
.s3 input[type=text],.s3 input[type=email],.s3 input[type=number],.s3 input[type=tel],.s3 input[type=url],.s3 select,.s3 textarea{width:100%;min-height:52px;padding:13px 16px;background:rgba(255,255,255,.55);border:1px solid #8f8a83;border-radius:4px;color:var(--s3-ink);font-size:var(--s3-fs-ui)}
.s3 textarea{min-height:140px}
.s3 [aria-invalid=true]{border-color:var(--s3-navy);border-width:2px}
.s3-error{margin-top:8px;font-weight:700;font-size:var(--s3-fs-fine)}
/* WordPress (Jetpack) contact forms on .s3 pages: same fields, labels and button as .s3-field/.s3-btn */
.s3 .jetpack-contact-form-container{margin-top:28px}
.s3 .contact-form .grunion-field-wrap{margin:0 0 22px;padding:0}
.s3 .contact-form .grunion-field-label{display:block;margin:0 0 8px;font:700 var(--s3-fs-ui)/1.3 var(--s3-sans);color:var(--s3-ink)}
.s3 .contact-form .grunion-field-label span{font-weight:400;font-size:var(--s3-fs-label);color:var(--s3-muted)}
.s3 .contact-form :is(input[type=text],input[type=email],textarea){width:100%;max-width:none;min-height:52px;padding:13px 16px;background:rgba(255,255,255,.55);border:1px solid #8f8a83;border-radius:4px;color:var(--s3-ink);font:var(--s3-fs-ui)/1.4 var(--s3-sans);box-shadow:none}
.s3 .contact-form textarea{min-height:180px}
.s3 .contact-form button[type=submit]{width:auto;margin-top:6px;box-shadow:none}
/* product presentation (no boxes: image, name, price, action) */
.s3-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:56px clamp(20px,3vw,48px)}
.s3-product{display:flex;flex-direction:column;min-width:0}
.s3-product .ph{display:block;aspect-ratio:1;width:100%;object-fit:cover;background:#ece6dc}
.s3-product h3{font:400 var(--s3-fs-title)/1.1 var(--s3-serif)!important;margin-top:18px}
.s3-product .amt{margin-top:8px;font:700 var(--s3-fs-ui)/1.3 var(--s3-sans)}
.s3-product .act{margin-top:18px}
.s3-product a.cover{text-decoration:none}
.s3-product a.cover:hover h3{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
/* FAQ: native disclosure, no boxes */
.s3-faq details{border-top:1px solid var(--s3-line)}
.s3-faq details:last-child{border-bottom:1px solid var(--s3-line)}
.s3-faq summary{display:flex;justify-content:space-between;align-items:center;gap:24px;min-height:64px;padding:18px 0;cursor:pointer;list-style:none;font:400 var(--s3-fs-lede)/1.25 var(--s3-serif)}
.s3-faq summary::-webkit-details-marker{display:none}
.s3-faq summary::after{content:"+";flex:none;font:400 2rem/1 var(--s3-serif)}
.s3-faq details[open] summary::after{content:"\2212"}
.s3-faq details>div{padding:0 0 28px;max-width:46em;font-size:var(--s3-fs-body);line-height:1.6}
/* long-form reading: legal, blog, policies */
.s3-prose{font:var(--s3-fs-body)/1.7 var(--s3-sans);color:var(--s3-ink)}
.s3-prose>*+*{margin-top:1.1em}
.s3-prose h2{font:400 var(--s3-fs-h3)/1.1 var(--s3-serif)!important;margin-top:2em}
.s3-prose h3{font:400 var(--s3-fs-title)/1.2 var(--s3-serif)!important;margin-top:1.6em}
.s3-prose h2+*,.s3-prose h3+*{margin-top:.6em}
.s3-prose ul,.s3-prose ol{padding-left:1.3em}
.s3-prose li+li{margin-top:.4em}
.s3-prose a{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.s3-prose a:hover{text-decoration-thickness:2px}
.s3-prose strong{font-weight:700}
.s3-prose table{width:100%;border-collapse:collapse;font-size:var(--s3-fs-fine)}
.s3-prose th,.s3-prose td{text-align:left;vertical-align:top;padding:10px 12px 10px 0;border-bottom:1px solid var(--s3-line)}
/* rate presets under a number field (calculators, Club pages): Weak / Typical / Strong pills that fill the box. The chosen one keeps its white
   fill with a bold navy ring; the others are greyed (Mercedes 2026-10-20: no solid navy pill).
   Markup + script: presetHtml() / PRESET_JS in calculators-data.mjs. */
.s3-pres{display:flex;gap:6px;margin-top:10px}
.s3 .s3-pre{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:44px;padding:8px 6px;border:1px solid #b9b4c9;border-radius:999px;background:#fff;color:var(--s3-ink);font:400 var(--s3-fs-label)/1 var(--s3-sans);white-space:nowrap;cursor:pointer}
.s3 .s3-pre b{font-weight:700}
.s3 .s3-pre:hover{border-color:var(--s3-ink)}
.s3 .s3-pre[aria-pressed=false]{color:var(--s3-muted);border-color:#cfd3dc;background:rgba(255,255,255,.7)}
.s3 .s3-pre[aria-pressed=true]{background:#fff;border-color:var(--s3-ink);box-shadow:inset 0 0 0 2px var(--s3-ink);color:var(--s3-ink)}
.s3 .s3-pre:focus-visible{outline:2px solid var(--s3-ink);outline-offset:2px}
.s3 .s3-hint{margin-top:10px;font-size:var(--s3-fs-fine);line-height:1.45;color:var(--s3-muted)}
@media(max-width:900px){
 .s3-split,.s3-split.flip{grid-template-columns:1fr}
 .s3-split.flip>:first-child{order:0}
}
@media(max-width:700px){
 .s3-btn{width:100%;padding:16px 18px;letter-spacing:.07em}
 .s3-btn.inline{width:auto}
 .s3-products{gap:44px}
}

/* 3. theme layer: plain theme + WooCommerce output (product pages, /shop/, 404, opt-out, posts). Scoped away from our own page roots. */
body:not(:has(.hp,.scx,.s3)){background:var(--s3-cream);color:var(--s3-ink);font:var(--s3-fs-body)/1.6 var(--s3-sans)}
body:not(:has(.hp,.scx,.s3)) .content-area{max-width:none!important;padding-left:0!important;padding-right:0!important}
body:not(:has(.hp,.scx,.s3)) .site-main{width:calc(100% - 2 * var(--s3-gut));max-width:none;margin:0 auto;padding:clamp(28px,4vw,64px) 0 var(--s3-sec)!important}
body.page:not(:has(.hp,.scx,.s3)) .site-main,body.single-post:not(:has(.hp,.scx,.s3)) .site-main,body.error404 .site-main{max-width:var(--s3-read)}
body:not(:has(.hp,.scx,.s3)) :is(h1,h2,h3,h4,h5,h6,.product_title,.page-title){font-family:var(--s3-serif)!important;font-weight:400!important;color:var(--s3-ink);text-transform:none;letter-spacing:-.01em;line-height:1.05}
body:not(:has(.hp,.scx,.s3)) :is(h1,.product_title,.page-title){font-size:clamp(2.8rem,5.5vw,5.2rem);letter-spacing:-.01em;line-height:.95;margin:0 0 .4em}
body:not(:has(.hp,.scx,.s3)) h2{font-size:var(--s3-fs-h2);margin:1.6em 0 .5em}
body:not(:has(.hp,.scx,.s3)) h3{font-size:var(--s3-fs-title);margin:1.4em 0 .4em}
body:not(:has(.hp,.scx,.s3)) a{color:var(--s3-ink)}
body:not(:has(.hp,.scx,.s3)) .site-main a:not(.button):not([class*=wc-block]){text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
body:not(:has(.hp,.s3)) :is(a,button,input,select,textarea,summary):focus-visible{outline:3px solid var(--s3-navy)!important;outline-offset:3px}
/* buttons: Hello Biz paints every <button> pink #c36, the old Additional CSS makes Woo buttons square. One pill for all of them. */
html body:not(:has(.hp,.scx,.s3)) :is(button,.button,input[type=submit],.wp-element-button,.single_add_to_cart_button,.search-submit):where(:not(.scxg *):not(.scxg-cart):not(.scxg-burger):not([class*=raccess]):not(.reset_variations):not(.cmplz-cookiebanner *):not([class*=cmplz]):not(.k1v3 *)){display:inline-flex!important;align-items:center;justify-content:center;text-align:center;min-height:52px;padding:15px 30px!important;border:0!important;border-radius:999px!important;background:var(--s3-sky)!important;color:var(--s3-navy)!important;font:800 var(--s3-fs-label)/1 var(--s3-sans)!important;letter-spacing:.12em!important;text-transform:uppercase;text-decoration:none!important;box-shadow:none!important;cursor:pointer;width:auto}
html body:not(:has(.hp,.scx,.s3)) :is(button,.button,input[type=submit],.wp-element-button,.single_add_to_cart_button,.search-submit):where(:not(.scxg *):not(.scxg-cart):not(.scxg-burger):not([class*=raccess]):not(.reset_variations):not(.cmplz-cookiebanner *):not([class*=cmplz]):not(.k1v3 *)):hover{background:var(--s3-navy)!important;color:#fff!important}
body:not(:has(.hp,.scx,.s3)) :is(input[type=text],input[type=email],input[type=search],input[type=number],input[type=tel],input[type=password],select,textarea):not(.scxg *):not(.k1v3 *){min-height:52px;padding:12px 16px;background:rgba(255,255,255,.55);border:1px solid #8f8a83;border-radius:4px;color:var(--s3-ink);font:var(--s3-fs-ui) var(--s3-sans)}
/* WooCommerce single product + archive */
body.woocommerce .woocommerce-breadcrumb{font:700 var(--s3-fs-label)/1.4 var(--s3-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--s3-muted);margin:0 0 28px}
body.woocommerce .woocommerce-breadcrumb a{color:var(--s3-muted)!important;text-decoration:none!important}
body.single-product div.product{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(32px,5vw,96px);align-items:start}
body.single-product div.product>.woocommerce-product-gallery,body.single-product div.product>.summary{width:auto!important;float:none!important;margin:0!important}
body.single-product div.product>:not(.woocommerce-product-gallery):not(.summary){grid-column:1/-1}
body.single-product .woocommerce-product-gallery img{width:100%;height:auto;background:#ece6dc}
body.single-product .woocommerce-product-gallery__image--placeholder{display:none}
body.woocommerce :is(.price,.woocommerce-Price-amount){color:var(--s3-ink)!important}
body.woocommerce .price :is(.woocommerce-Price-amount,bdi,ins){font:inherit!important;color:inherit!important;text-decoration:none}
body.single-product .summary .price{font:400 var(--s3-fs-title)/1.1 var(--s3-serif)!important;margin:0 0 28px}
body.single-product .summary .price del{color:var(--s3-muted)}
body.single-product .woocommerce-product-details__short-description{font:var(--s3-fs-lede)/1.5 var(--s3-sans);margin-bottom:28px}
body.single-product form.cart{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin:0 0 32px}
body.single-product form.cart.variations_form{display:block}
body.single-product table.variations{width:100%;border:0;margin:0 0 20px;border-collapse:collapse}
body.single-product table.variations :is(th,td){display:block;padding:0;border:0;background:none;text-align:left}
body.single-product table.variations td.value{padding-bottom:22px}
body.single-product table.variations th label{display:block;margin:0 0 8px;font:700 var(--s3-fs-label)/1.3 var(--s3-sans);letter-spacing:.14em;text-transform:uppercase}
body.single-product table.variations select{width:100%;max-width:380px}
body.single-product .reset_variations{display:inline-flex;align-items:center;min-height:44px;font-size:var(--s3-fs-fine)!important;color:var(--s3-ink)!important}
body.single-product .woocommerce-variation-add-to-cart{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin-top:16px}
body.single-product .quantity input.qty{width:88px;text-align:center}
body.single-product .single_variation .price{font-size:var(--s3-fs-lede)!important;margin:0 0 6px}
body.single-product .product_meta{font-size:var(--s3-fs-fine);color:var(--s3-muted)}
body.single-product .product_meta a{color:var(--s3-muted)!important}
body.single-product .woocommerce-tabs{margin-top:clamp(48px,6vw,96px);border-top:1px solid var(--s3-line);padding-top:8px}
body.single-product .woocommerce-tabs ul.tabs{display:flex;flex-wrap:wrap;gap:0 36px;margin:0 0 28px!important;padding:0!important;list-style:none;border:0;background:none!important;border-radius:0!important;box-shadow:none!important}
body.single-product .woocommerce-tabs ul.tabs::before,body.single-product .woocommerce-tabs ul.tabs li::before,body.single-product .woocommerce-tabs ul.tabs li::after{display:none!important}
body.single-product .woocommerce-tabs ul.tabs li{margin:0;padding:0;border:0!important;background:none!important;border-radius:0}
body.single-product .woocommerce-tabs ul.tabs li a{display:inline-flex;align-items:center;min-height:52px;padding:0!important;border:0!important;border-bottom:2px solid transparent!important;border-radius:0!important;background:none!important;box-shadow:none!important;font:800 var(--s3-fs-label)/1 var(--s3-sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none!important;color:var(--s3-muted)!important}
body.single-product .woocommerce-tabs ul.tabs li.active a{color:var(--s3-ink)!important;border-bottom-color:var(--s3-sky)!important}
body.single-product .woocommerce-tabs .panel{max-width:var(--s3-read);font-size:var(--s3-fs-body);color:var(--s3-ink)}
body.single-product .woocommerce-tabs .panel :is(p,li){color:var(--s3-ink)!important}
body.single-product .woocommerce-tabs .panel>h2:first-child{display:none}
body.woocommerce table.shop_attributes{width:100%;border:0;border-collapse:collapse}
body.woocommerce table.shop_attributes :is(th,td){padding:12px 12px 12px 0;border:0;border-bottom:1px solid var(--s3-line);background:none!important;text-align:left;font-style:normal}
body.woocommerce :is(.related,.upsells)>h2{font-size:var(--s3-fs-h2)!important;margin:clamp(64px,8vw,120px) 0 36px}
body.woocommerce ul.products{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px clamp(20px,3vw,48px);margin:0!important;padding:0;list-style:none}
body.woocommerce ul.products::before,body.woocommerce ul.products::after{display:none!important}
body.woocommerce ul.products li.product{width:auto!important;float:none!important;margin:0!important;padding:0;display:flex;flex-direction:column;text-align:left}
body.woocommerce ul.products li.product a.woocommerce-loop-product__link{text-decoration:none!important}
body.woocommerce ul.products li.product img{width:100%;aspect-ratio:1;object-fit:cover;margin:0 0 18px!important;background:#ece6dc}
body.woocommerce ul.products li.product .woocommerce-loop-product__title{font:400 var(--s3-fs-title)/1.1 var(--s3-serif)!important;padding:0!important;margin:0 0 8px}
body.woocommerce ul.products li.product .price{display:block;font:700 var(--s3-fs-ui)/1.3 var(--s3-sans)!important;margin:0 0 16px}
body.woocommerce ul.products li.product .button{margin-top:auto;align-self:flex-start;min-height:48px!important;padding:13px 16px!important;font-size:var(--s3-fs-label)!important;letter-spacing:.05em!important;white-space:nowrap}
body.woocommerce .woocommerce-products-header{margin-bottom:24px}
body.woocommerce :is(.woocommerce-result-count,.woocommerce-ordering){margin:0 0 36px;font-size:var(--s3-fs-fine);color:var(--s3-muted)}
body.woocommerce .onsale{background:var(--s3-navy)!important;color:#fff!important;border-radius:999px;min-height:0;line-height:1;padding:8px 14px;font:700 var(--s3-fs-label)/1 var(--s3-sans);letter-spacing:.14em;text-transform:uppercase}
/* WooCommerce notices (classic templates) */
body:not(:has(.hp,.s3)) :is(.woocommerce-message,.woocommerce-info,.woocommerce-error){margin:0 0 28px;padding:18px 22px!important;border:0!important;border-radius:4px;background:#fff!important;color:var(--s3-ink)!important;font-size:var(--s3-fs-body);list-style:none}
body:not(:has(.hp,.s3)) :is(.woocommerce-message,.woocommerce-info,.woocommerce-error)::before{display:none!important}
body:not(:has(.hp,.s3)) .woocommerce-error{background:var(--s3-navy)!important;color:#fff!important;font-weight:700}
body:not(:has(.hp,.s3)) .woocommerce-error a{color:#fff!important}
body:not(:has(.hp,.s3)) :is(.woocommerce-message,.woocommerce-info) .button{float:none;margin:0 0 0 16px}
/* 404 + search */
body.error404 .page-header{margin-bottom:24px}
body.error404 .search-form{display:flex;flex-wrap:wrap;gap:12px;width:100%;max-width:560px;margin:24px auto 0;position:static}
body.error404 .search-form label{flex:1 1 220px;min-width:0}
body.error404 .search-field{width:100%}
body.error404 .search-submit{position:static!important;inset:auto!important;transform:none!important;flex:none}
/* Complianz documents (opt-out preferences, cookie statement) */
body:not(:has(.hp,.scx,.s3)) .cmplz-document{max-width:none;font-size:var(--s3-fs-body);overflow-x:clip}
body:not(:has(.hp,.scx,.s3)) .cmplz-document :is(p,li,td,th,summary,span,div){font-size:var(--s3-fs-body)!important;line-height:1.65!important}
body:not(:has(.hp,.scx,.s3)) .cmplz-document :is(h2,h3){font-size:var(--s3-fs-h3)!important;line-height:1.1!important;margin:1.6em 0 .5em!important}
body:not(:has(.hp,.scx,.s3)) .cmplz-document :is(h2,h3){font-family:var(--s3-serif)!important;font-weight:400!important}
body:not(:has(.hp,.scx,.s3)) .cmplz-document .cmplz-dropdown summary{min-height:48px}
body:not(:has(.hp,.scx,.s3)) .cmplz-document :is(h4,h5,h6){font:700 var(--s3-fs-label)/1.3 var(--s3-sans)!important;letter-spacing:.06em}
body:not(:has(.hp,.scx,.s3)) .cmplz-document a{color:var(--s3-ink)!important}
@media(max-width:1000px){body.woocommerce ul.products{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){body.single-product div.product{grid-template-columns:1fr}}
@media(max-width:520px){body.woocommerce ul.products{gap:40px 16px}body.woocommerce ul.products li.product .woocommerce-loop-product__title{font-size:var(--s3-fs-lede)!important}body.woocommerce ul.products li.product .button{width:100%;padding:12px 10px!important;font-size:var(--s3-fs-label)!important;letter-spacing:.03em!important;line-height:1.2!important;white-space:normal}body.single-product .woocommerce-variation-add-to-cart .single_add_to_cart_button,body.single-product form.cart:not(.variations_form) .single_add_to_cart_button{flex:1 1 auto}}

/* Complianz cookie banner (every page, incl. the homepage): only the colors that fail AA or clash are changed.
   Accept = sky blue with navy text (white on sky is 2.6:1); banner links navy. */
body .cmplz-cookiebanner .cmplz-btn.cmplz-accept{background:#4da3ff!important;border-color:#4da3ff!important;color:#0a1930!important;font-weight:700}
body .cmplz-cookiebanner .cmplz-btn.cmplz-accept:hover{background:#0a1930!important;border-color:#0a1930!important;color:#fff!important}
body .cmplz-cookiebanner .cmplz-links a,body .cmplz-cookiebanner .cmplz-link{color:#0a1930!important}
body .cmplz-manage-consent{background:#4da3ff!important;color:#0a1930!important}

/* accessibility plugin skip link (shows on keyboard focus): on the type scale like everything else */
/* accessibility toolbar plugin: its accent setting is still the old orange (#ff6338); sky blue on its black panel is 8.4:1 */
body .raccess-toolbar-panel{--raccess-accent:#4da3ff!important}
body .raccess-skip-link,body .skip-link{font-size:var(--s3-fs-ui)!important;color:#fff!important}

/* Cart + Checkout still carry the old .scx-woo prelude (commerce session migrates them next). Once the old Customizer CSS is removed,
   these keep their headings and any classic Woo buttons on v3 instead of falling back to Hello Biz defaults. */
body:has(.scx-woo) .page-content>h1,body:has(.scx-woo) .page-content .wp-block-heading{font-family:var(--s3-serif)!important;font-weight:400!important;text-transform:none!important;letter-spacing:-.01em!important;color:var(--s3-ink)}
body:has(.scx-woo) .woocommerce :is(a.button,button.button,input.button,.wc-backward){display:inline-flex!important;align-items:center;justify-content:center;min-height:52px;padding:15px 30px!important;border:0!important;border-radius:999px!important;background:var(--s3-sky)!important;color:var(--s3-navy)!important;font:800 var(--s3-fs-label)/1 var(--s3-sans)!important;letter-spacing:.12em!important;text-transform:uppercase!important;text-decoration:none!important}
body:has(.scx-woo) .woocommerce :is(a.button,button.button,input.button,.wc-backward):hover{background:var(--s3-navy)!important;color:#fff!important}

/* My Account (WooCommerce page 8) + the $1K member area (.k1a.k1v3, printed by the WPCode "My $1k Plan Snippet" from
   automation/k1-launch). v3 look on the shared tokens and type scale (nothing under 15px). Printed site-wide after v3.css by
   install-chrome.mjs, so restyles ship over REST with no snippet re-paste. Member rules only match the .k1v3 class that the
   2026-10-03 snippet prints, so the older pasted snippet keeps its own look until it is replaced. */

/* ---- account frame (every account screen, logged in or not) ---- */
body.woocommerce-account:not(:has(.hp,.scx,.s3)) .site-main{max-width:1320px}
body.woocommerce-account .woocommerce:has(>.woocommerce-MyAccount-navigation){display:grid;grid-template-columns:230px minmax(0,1fr);gap:clamp(28px,4vw,64px);align-items:start}
body.woocommerce-account .woocommerce:has(>.woocommerce-MyAccount-navigation)::before,body.woocommerce-account .woocommerce:has(>.woocommerce-MyAccount-navigation)::after{display:none}
body.woocommerce-account :is(.woocommerce-MyAccount-navigation,.woocommerce-MyAccount-content){float:none!important;width:auto!important;margin:0!important}
body.woocommerce-account .woocommerce-MyAccount-navigation ul{list-style:none;margin:0;padding:0}
body.woocommerce-account .woocommerce-MyAccount-navigation li{margin:0 0 4px;padding:0;border:0}
body.woocommerce-account .woocommerce-MyAccount-navigation li a{display:flex;align-items:center;min-height:48px;padding:10px 18px;border-radius:999px;color:var(--s3-ink)!important;text-decoration:none!important;font:600 var(--s3-fs-ui)/1.25 var(--s3-sans)}
body.woocommerce-account .woocommerce-MyAccount-navigation li a:hover{background:#dfe4f0}
body.woocommerce-account .woocommerce-MyAccount-navigation li.is-active a{background:var(--s3-black);color:#fff!important}
body.woocommerce-account .woocommerce-MyAccount-content{font-size:var(--s3-fs-body);line-height:1.55}
body.woocommerce-account .woocommerce-MyAccount-content>p:first-child{margin-top:0}
body.woocommerce-account .woocommerce-MyAccount-content mark{background:none;color:inherit;font-weight:700}
/* orders / downloads / order details tables */
body.woocommerce-account .woocommerce-MyAccount-content table.shop_table,body.woocommerce-order-received table.shop_table{width:100%;border:0;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;font-size:var(--s3-fs-fine)}
body.woocommerce-account table.shop_table :is(th,td),body.woocommerce-order-received table.shop_table :is(th,td){padding:14px 16px;border:0;border-bottom:1px solid var(--s3-line);background:none;text-align:left;vertical-align:middle}
body.woocommerce-account table.shop_table thead th,body.woocommerce-order-received table.shop_table thead th{font:700 var(--s3-fs-label)/1.3 var(--s3-sans);letter-spacing:.12em;text-transform:uppercase}
body.woocommerce-account table.shop_table tr:last-child>*{border-bottom:0}
body.woocommerce-account table.shop_table .button{min-height:44px!important;padding:10px 18px!important;margin:4px 6px 4px 0!important;font-size:var(--s3-fs-label)!important}
/* login / register / lost password */
body.woocommerce-account :is(form.woocommerce-form-login,form.woocommerce-form-register,form.woocommerce-ResetPassword,form.lost_reset_password){max-width:560px;margin:0 0 32px;padding:clamp(24px,3vw,40px);border:0;border-radius:16px;background:#fff}
body.woocommerce-account :is(form.woocommerce-form-login,form.woocommerce-form-register,form.woocommerce-ResetPassword,form.lost_reset_password) label{display:block;margin:0 0 8px;font:600 var(--s3-fs-ui)/1.35 var(--s3-sans)}
body.woocommerce-account :is(form.woocommerce-form-login,form.woocommerce-form-register,form.woocommerce-ResetPassword,form.lost_reset_password) .input-text{width:100%}
body.woocommerce-account .woocommerce-form-login__rememberme{display:inline-flex!important;align-items:center;gap:8px;margin:8px 16px 0 0!important;font-weight:400!important}
body.woocommerce-account :is(.woocommerce-LostPassword,.lost_password){font-size:var(--s3-fs-fine)}
body.woocommerce-account .u-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,3vw,48px)}
body.woocommerce-account .u-columns>.u-column1,body.woocommerce-account .u-columns>.u-column2{width:auto!important;float:none!important}
body.woocommerce-account .woocommerce>h2,body.woocommerce-account .u-columns h2{font-size:var(--s3-fs-h3)!important;margin:0 0 20px!important}
/* WooCommerce's show/hide password eye is a <button>: keep it a plain icon, not a theme-layer pill */
html body.woocommerce-account .woocommerce .show-password-input,html body.woocommerce-checkout .woocommerce .show-password-input{display:flex!important;align-items:center;justify-content:center;min-height:44px!important;width:44px;padding:0!important;border:0!important;border-radius:4px!important;background:transparent!important;color:var(--s3-ink)!important;box-shadow:none!important}
html body.woocommerce-account .woocommerce .show-password-input:hover{background:#dfe4f0!important}
body.woocommerce-account .woocommerce-form-login__rememberme input,body.woocommerce-account input[type=checkbox]{width:22px;height:22px;accent-color:var(--s3-navy)}
/* addresses + account details */
body.woocommerce-account .woocommerce-Addresses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
body.woocommerce-account .woocommerce-Addresses::before,body.woocommerce-account .woocommerce-Addresses::after{display:none}
body.woocommerce-account .woocommerce-Address{width:auto!important;float:none!important;background:#fff;border-radius:16px;padding:clamp(20px,2.6vw,32px)}
body.woocommerce-account .woocommerce-Address address{font-style:normal;line-height:1.6}
body.woocommerce-account :is(.woocommerce-EditAccountForm,.woocommerce-address-fields) label{font:600 var(--s3-fs-ui)/1.35 var(--s3-sans)}
/* question lines stay Jost (no upright serif outside headlines) */
body.woocommerce-account fieldset legend{font:600 var(--s3-fs-ui)/1.35 var(--s3-sans);padding:0;margin:24px 0 12px}
@media(max-width:860px){
 body.woocommerce-account .woocommerce:has(>.woocommerce-MyAccount-navigation){grid-template-columns:minmax(0,1fr);gap:24px}
 body.woocommerce-account .woocommerce-MyAccount-navigation ul{display:flex;flex-wrap:wrap;gap:8px}
 body.woocommerce-account .woocommerce-MyAccount-navigation li{margin:0}
 body.woocommerce-account .woocommerce-MyAccount-navigation li a{background:#fff;min-height:44px;padding:8px 16px}
 body.woocommerce-account :is(.u-columns,.woocommerce-Addresses){grid-template-columns:1fr}
}
@media(max-width:600px){
 body.woocommerce-account table.shop_table_responsive tr{display:block;padding:8px 0;border-bottom:1px solid var(--s3-line)}
 body.woocommerce-account table.shop_table_responsive thead{display:none}
 body.woocommerce-account table.shop_table_responsive td{display:flex;justify-content:space-between;gap:16px;border:0!important;padding:8px 16px;text-align:right}
 body.woocommerce-account table.shop_table_responsive td::before{content:attr(data-title);font-weight:700;text-align:left}
}

/* ---- order thank-you panel (snippet prints .k1ty on the order-received page) ---- */
.k1ty{margin:24px 0;padding:clamp(24px,3vw,40px);border-radius:16px;background:var(--s3-black);color:#fff}
.k1ty .t{margin:0 0 10px;font:400 var(--s3-fs-title)/1.15 var(--s3-serif);color:#fff}
.k1ty p{margin:0 0 18px;color:#fff;font-size:var(--s3-fs-body);line-height:1.55}
.k1ty .acts{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin:0 0 4px}
.k1ty a.go{display:inline-flex;align-items:center;min-height:52px;padding:0 30px;border-radius:999px;background:var(--s3-sky);color:var(--s3-navy)!important;font:800 var(--s3-fs-label)/1 var(--s3-sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none!important}
.k1ty a.go:hover{background:#fff;color:var(--s3-navy)!important}
.k1ty a.alt{display:inline-flex;align-items:center;min-height:44px;color:#fff!important;font:600 var(--s3-fs-ui)/1 var(--s3-sans);text-decoration:underline!important;text-underline-offset:4px}
.k1ty .small{margin:16px 0 0;font-size:var(--s3-fs-fine);color:var(--s3-mist-ink)}
.k1ty :focus-visible{outline:3px solid #fff!important;outline-offset:3px}

/* ---- $1K member area ---- */
.k1a.k1v3{--k1-panel:#dfe4f0;color:var(--s3-ink);font:var(--s3-fs-body)/1.55 var(--s3-sans)}
.k1v3 *{box-sizing:border-box}
.k1v3 [hidden]{display:none!important}
.k1v3 h2{margin:0 0 16px;font-family:var(--s3-serif)!important;font-weight:400!important;font-size:var(--s3-fs-h3)!important;line-height:1.05!important;letter-spacing:-.01em;text-transform:none!important;color:inherit}
.k1v3 h3{margin:0 0 10px;font-family:var(--s3-serif)!important;font-weight:400!important;font-size:var(--s3-fs-lede)!important;line-height:1.2!important;letter-spacing:-.01em;text-transform:none!important;color:inherit}
.k1v3 p{margin:0 0 12px;font-size:var(--s3-fs-body);line-height:1.55;color:inherit}
.k1v3 a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.k1v3 :is(a,button,input,select,textarea,summary):focus-visible{outline:3px solid var(--s3-navy);outline-offset:3px}
.k1v3 .sec.black :is(a,button,input,select,textarea,summary):focus-visible{outline-color:#fff}
.k1v3 .sec{margin:0 0 24px;padding:clamp(20px,2.6vw,36px);border-radius:16px;background:#fff}
.k1v3 .sec.teal{background:var(--k1-panel)}
.k1v3 .sec.cream{background:var(--s3-cream);box-shadow:inset 0 0 0 1px var(--s3-line)}
.k1v3 .sec.black{background:var(--s3-black);color:#fff}
.k1v3 .sec.black :is(h2,h3,p,label,legend,summary,li){color:#fff}
.k1v3 .sec.black a{color:#fff}
.k1v3 .big{font:400 clamp(2.8rem,5vw,4.4rem)/.95 var(--s3-serif);letter-spacing:-.01em;color:inherit}
.k1v3 .sec.black .big{color:var(--s3-sky)}
.k1v3 .stripe{display:flex;align-items:center;gap:16px;margin:16px 0 8px}
.k1v3 .stripe .track{flex:1;margin:0}
.k1v3 .stripe b{min-width:3.2em;text-align:right;font:400 var(--s3-fs-h3)/1 var(--s3-serif);color:var(--s3-ink)}
.k1v3 .sec.black .stripe b{color:var(--s3-sky)}
.k1v3 .track{height:clamp(28px,3vw,40px);margin:16px 0 8px;border-radius:999px;background:var(--k1-panel);overflow:hidden}
.k1v3 .sec.black .track{background:#24365a}
/* on the blue-mist panels the track would vanish into the panel, so it is white there */
.k1v3 .sec.teal .track{background:#fff}
.k1v3 .track i{display:block;height:100%;background:var(--s3-sky)}
.k1v3 .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.k1v3 .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.k1v3 label{display:block;margin:0 0 8px;font:600 var(--s3-fs-ui)/1.35 var(--s3-sans);color:inherit}
.k1v3 :is(input:not([type]),input[type=text],input[type=number],input[type=email],input[type=tel],input[type=url],input[type=date],select,textarea){width:100%;min-height:52px;padding:12px 16px;border:1px solid #8f8a83;border-radius:4px;background:#fff;font:var(--s3-fs-ui)/1.35 var(--s3-sans);color:var(--s3-ink)}
.k1v3 textarea{min-height:110px}
.k1v3 input[type=file]{min-height:0;padding:12px}
.k1v3 .btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;margin-top:16px;padding:0 30px;border:0;border-radius:999px;background:var(--s3-black);color:#fff!important;font:800 var(--s3-fs-label)/1 var(--s3-sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none!important;cursor:pointer}
.k1v3 .btn:hover{background:var(--s3-sky);color:var(--s3-navy)!important}
.k1v3 :is(.btn.teal,.btn.or){background:var(--s3-sky);color:var(--s3-navy)!important}
.k1v3 :is(.btn.teal,.btn.or):hover{background:var(--s3-black);color:#fff!important}
.k1v3 .sec.black .btn{background:var(--s3-sky);color:var(--s3-navy)!important}
.k1v3 .sec.black .btn:hover{background:#fff;color:var(--s3-navy)!important}
.k1v3 .note{font-size:var(--s3-fs-fine);line-height:1.5;color:var(--s3-muted)}
.k1v3 .sec.black .note{color:var(--s3-mist-ink)!important}
.k1v3 .ok{margin:0 0 16px;padding:14px 18px;border-radius:4px;background:var(--k1-panel);color:var(--s3-ink);font-weight:700}
.k1v3 .warn{margin:0 0 16px;padding:14px 18px;border-radius:4px;background:#fff3c4;color:var(--s3-navy)!important;font-weight:700}
.k1v3 table{width:100%;border-collapse:collapse;font-size:var(--s3-fs-fine)}
.k1v3 :is(th,td){padding:12px 10px;border-bottom:1px solid var(--s3-line);text-align:left;vertical-align:top;color:inherit}
.k1v3 th{font:700 var(--s3-fs-label)/1.3 var(--s3-sans);letter-spacing:.12em;text-transform:uppercase}
.k1v3 td .x{display:inline-flex;align-items:center;min-height:44px;padding:0;border:0;background:none;font:600 var(--s3-fs-label)/1 var(--s3-sans);text-decoration:underline;color:inherit;cursor:pointer}
.k1v3 .calc-out{margin-top:12px;font:400 clamp(2.4rem,4vw,3.4rem)/1 var(--s3-serif)}
.k1v3 .sec.black .calc-out{margin:18px 0 8px;font-size:clamp(2.8rem,6vw,4.6rem);color:var(--s3-sky);overflow-wrap:anywhere}
.k1v3 .k1calc>.grid3 label{color:#fff}
.k1v3 .k1calc .calc-panel{margin-top:20px;padding:clamp(18px,2.4vw,28px);border-radius:16px;background:#fff;color:var(--s3-ink)}
.k1v3 .k1calc .calc-panel :is(h3,p,label,legend,summary,li){color:var(--s3-ink)}
.k1v3 .k1calc .calc-panel .note{color:var(--s3-muted)!important}
.k1v3 .k1calc .calc-panel :focus-visible{outline-color:var(--s3-navy)}
.k1v3 .calc-pills,.k1v3 .calc-scen{display:flex;flex-wrap:wrap;gap:8px}
.k1v3 .calc-scen{margin:0 0 12px}
.k1v3 label.calc-pill{position:relative;display:inline-flex;margin:0;cursor:pointer}
.k1v3 .calc-pill input{position:absolute;width:1px;height:1px;min-height:0;opacity:0}
.k1v3 :is(.calc-pill span,.calc-scen button){display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border:0;border-radius:999px;background:#fff;color:var(--s3-ink);box-shadow:inset 0 0 0 1px #8f8a83;font:600 var(--s3-fs-ui)/1 var(--s3-sans);cursor:pointer}
/* chosen scenario / pill: white with a bold navy ring, the others greyed (same as the site's rate presets, Mercedes 2026-10-20) */
.k1v3 .calc-pill input:not(:checked)+span,.k1v3 .calc-scen button[aria-checked=false]{color:var(--s3-muted);box-shadow:inset 0 0 0 1px #cfd3dc}
